<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WORKSPACE.AI — Studio Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

    body {
      background-color: #000000;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: #f8fafc;
      overflow-x: hidden;
    }

    .font-cinematic {
      font-family: 'Syncopate', sans-serif;
      letter-spacing: 0.22em;
    }

    @media (max-width: 640px) {
      .font-cinematic {
        letter-spacing: 0.16em;
      }
    }

    #galaxyCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
      pointer-events: none;
    }

    .lunar-eclipse-horizon {
      position: fixed;
      top: -380px;
      left: 50%;
      transform: translateX(-50%);
      width: 130vw;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(12, 16, 26, 0.85) 0%, rgba(3, 5, 10, 0.95) 75%, rgba(0, 0, 0, 1) 100%);
      border-bottom: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 15px 80px rgba(255, 255, 255, 0.25), 0 35px 140px rgba(66, 133, 244, 0.25);
      z-index: 5;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .lunar-eclipse-horizon {
        top: -420px;
        width: 190vw;
        height: 520px;
      }
    }

    .lunar-nav {
      background: rgba(4, 6, 12, 0.65);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
    }

    .lunar-panel-hero {
      background: rgba(10, 14, 22, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .lunar-panel-compact {
      background: rgba(10, 14, 22, 0.07);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.24s cubic-bezier(0.2, 0, 0, 1);
    }

    .lunar-panel-compact:hover {
      background: rgba(14, 20, 32, 0.18);
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    .lunar-drawer {
      background: rgba(4, 6, 14, 0.95);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: -30px 0 80px rgba(0, 0, 0, 0.9);
    }

    .lunar-modal {
      background: rgba(8, 12, 20, 0.96);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.95);
    }

    .btn-lunar-action {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .btn-lunar-primary {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .google-border-top {
      background: linear-gradient(90deg, #4285f4 0%, #ea4335 25%, #fbbc05 50%, #34a853 75%, #4285f4 100%);
      height: 3px;
      width: 100%;
    }
  </style>
</head>
<body class="flex flex-col min-h-[100dvh] relative overflow-x-hidden">

  <canvas id="galaxyCanvas"></canvas>
  <div class="lunar-eclipse-horizon"></div>
  <div class="fixed top-0 left-0 right-0 z-50 google-border-top"></div>

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <header class="sticky top-0 z-40 lunar-nav mt-[3px]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between gap-3">
      
      <!-- Brand & Camera Aperture Logo -->
      <a href="/workspace.html" class="flex items-center gap-2.5 sm:gap-3.5 shrink-0 group select-none">
        <div class="relative w-8 h-8 sm:w-10 sm:h-10 shrink-0 rounded-xl sm:rounded-2xl p-[1.5px] bg-gradient-to-tr from-[#4285F4] via-[#EA4335] to-[#34A853]">
          <div class="w-full h-full rounded-[10px] sm:rounded-[14px] bg-black flex items-center justify-center p-1 overflow-hidden">
            <svg class="w-full h-full" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="16" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="2 2" />
              <line x1="24" y1="11" x2="33" y2="17" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
              <line x1="33" y1="17" x2="27" y2="21" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
              <line x1="37" y1="24" x2="31" y2="33" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" />
              <line x1="31" y1="33" x2="27" y2="27" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" />
              <line x1="24" y1="37" x2="15" y2="31" stroke="#34A853" stroke-width="3" stroke-linecap="round" />
              <line x1="15" y1="31" x2="21" y2="27" stroke="#34A853" stroke-width="3" stroke-linecap="round" />
              <line x1="11" y1="24" x2="17" y2="15" stroke="#4285F4" stroke-width="3" stroke-linecap="round" />
              <line x1="17" y1="15" x2="21" y2="21" stroke="#4285F4" stroke-width="3" stroke-linecap="round" />
              <circle cx="24" cy="24" r="4.5" fill="#4285F4" />
              <circle cx="24" cy="24" r="2" fill="#ffffff" opacity="0.9" />
            </svg>
          </div>
        </div>

        <div class="flex flex-col justify-center">
          <div class="flex items-center gap-1.5">
            <span class="font-cinematic text-xs sm:text-sm font-bold tracking-widest text-white leading-none uppercase">
              WORKSPACE<span class="text-blue-400">.AI</span>
            </span>
            <span class="hidden xs:inline-flex items-center px-1.5 py-0.5 rounded-full text-[7px] sm:text-[8px] font-bold bg-white/10 text-slate-300 border border-white/15 leading-none">
              PRO
            </span>
          </div>
          <div class="flex items-center gap-1 pt-0.5 sm:pt-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-[8px] sm:text-[9px] font-bold uppercase tracking-[0.16em] text-slate-400 leading-none">
              STUDIO
            </span>
          </div>
        </div>
      </a>

      <!-- Search Input (Desktop) -->
      <div class="hidden md:flex items-center flex-1 max-w-md mx-6">
        <div class="relative w-full">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search collections..." 
            oninput="handleSearch(event)"
            class="w-full pl-10 pr-4 py-2 rounded-full border border-white/10 bg-white/5 focus:bg-black/60 focus:border-white/30 outline-none text-xs text-white placeholder-slate-500 font-medium transition"
          >
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        <a href="events.html" class="hidden sm:inline-flex items-center gap-1.5 btn-lunar-action px-3 sm:px-4 py-2 rounded-full text-xs font-semibold tracking-wider">
          <i data-lucide="folders" class="w-3.5 h-3.5 text-blue-400"></i>
          <span>EVENTS</span>
        </a>

        <button onclick="openCreateModal()" class="inline-flex items-center gap-1.5 btn-lunar-primary text-[11px] sm:text-xs font-bold px-3.5 sm:px-5 py-2 sm:py-2.5 rounded-full uppercase tracking-wider">
          <i data-lucide="plus" class="w-3.5 h-3.5 text-black stroke-[3]"></i>
          <span>New</span>
        </button>

        <button 
          type="button"
          onclick="toggleProfileSidebar(true)" 
          class="flex items-center gap-1.5 sm:gap-2.5 bg-white/5 hover:bg-white/10 border border-white/10 p-1 sm:p-1.5 sm:pr-3 rounded-full transition"
        >
          <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white text-black font-black text-xs flex items-center justify-center uppercase shadow-sm" id="navUserInitial">
            P
          </div>
          <i data-lucide="menu" class="w-4 h-4 text-slate-400 block sm:hidden pr-0.5"></i>
          <div class="text-left leading-none hidden lg:block">
            <p class="text-xs font-bold text-white tracking-wide" id="navUserName">Photographer</p>
          </div>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= MAIN WORKSPACE ================= -->
  <main class="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 pt-20 sm:pt-32 pb-16 space-y-6 sm:space-y-8">

    <!-- Mobile Search Bar -->
    <div class="block md:hidden relative w-full pt-1">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
      <input 
        type="text" 
        placeholder="Search collections..." 
        oninput="handleSearch(event)"
        class="w-full pl-10 pr-4 py-2.5 rounded-full border border-white/10 bg-white/5 focus:bg-black/60 focus:border-white/30 outline-none text-xs text-white placeholder-slate-500 font-medium"
      >
    </div>

    <!-- Hero Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="lunar-panel-hero px-4 sm:px-6 py-3.5 sm:py-4 rounded-2xl flex items-center gap-3.5 sm:gap-4 w-full sm:w-auto">
        <div class="relative w-9 h-9 sm:w-11 sm:h-11 shrink-0 rounded-xl sm:rounded-2xl p-[1.5px] bg-gradient-to-tr from-[#4285F4] via-[#EA4335] to-[#34A853]">
          <div class="w-full h-full rounded-[10px] sm:rounded-[14px] bg-black flex items-center justify-center p-1 overflow-hidden">
            <svg class="w-full h-full" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="16" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="2 2" />
              <line x1="24" y1="11" x2="33" y2="17" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
              <line x1="33" y1="17" x2="27" y2="21" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
              <line x1="37" y1="24" x2="31" y2="33" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" />
              <line x1="31" y1="33" x2="27" y2="27" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" />
              <line x1="24" y1="37" x2="15" y2="31" stroke="#34A853" stroke-width="3" stroke-linecap="round" />
              <line x1="15" y1="31" x2="21" y2="27" stroke="#34A853" stroke-width="3" stroke-linecap="round" />
              <circle cx="24" cy="24" r="4.5" fill="#4285F4" />
              <circle cx="24" cy="24" r="2" fill="#ffffff" opacity="0.9" />
            </svg>
          </div>
        </div>

        <div>
          <h2 class="font-cinematic text-sm sm:text-lg font-normal text-white uppercase tracking-[0.2em]">
            EVENT PORTALS
          </h2>
          <p class="text-[11px] sm:text-xs text-slate-400 font-medium">
            Photo delivery and automated face indexing.
          </p>
        </div>
      </div>

      <button 
        onclick="openCreateModal()" 
        class="hidden sm:inline-flex items-center gap-2 btn-lunar-primary text-xs font-bold px-5 py-3 rounded-full uppercase tracking-wider"
      >
        <i data-lucide="plus" class="w-4 h-4 text-black stroke-[3]"></i>
        <span>Create New Event</span>
      </button>
    </div>

    <!-- Compact Dynamic Grid -->
    <div id="eventsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5 sm:gap-4"></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-12 text-center lunar-panel-hero rounded-[2rem] p-6 max-w-sm mx-auto">
      <div class="w-12 h-12 rounded-full bg-white/5 border border-white/10 text-white flex items-center justify-center mb-3">
        <i data-lucide="camera" class="w-6 h-6"></i>
      </div>
      <h3 class="font-cinematic text-xs sm:text-sm font-bold text-white uppercase tracking-widest">No Events Found</h3>
      <p class="text-xs text-slate-400 mt-1.5 mb-5 font-medium leading-relaxed">
        Create your first collection to upload and index guest photos.
      </p>
      <button onclick="openCreateModal()" class="inline-flex items-center gap-1.5 btn-lunar-primary text-xs font-bold px-5 py-2.5 rounded-full uppercase tracking-wider">
        <i data-lucide="plus" class="w-3.5 h-3.5 text-black"></i>
        <span>Create Event</span>
      </button>
    </div>

  </main>

  <!-- ================= PROFILE DRAWER ================= -->
  <div id="sidebarBackdrop" onclick="toggleProfileSidebar(false)" class="fixed inset-0 bg-black/80 backdrop-blur-xs z-50 hidden transition-opacity duration-300 opacity-0"></div>

  <aside id="profileSidebar" class="fixed top-0 right-0 h-full w-[85vw] sm:w-80 lunar-drawer z-50 transform translate-x-full transition-transform duration-300 flex flex-col justify-between p-5 sm:p-7">
    <div class="space-y-5">
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <h3 class="font-cinematic text-xs font-bold text-white tracking-widest uppercase">STUDIO</h3>
        <button type="button" onclick="toggleProfileSidebar(false)" class="p-1.5 rounded-full text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="bg-black/60 border border-white/10 rounded-2xl p-4 flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-white text-black font-black text-lg flex items-center justify-center shadow-md shrink-0" id="drawerUserInitial">
          P
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-bold text-white truncate" id="drawerUserName">Photographer</p>
          <p class="text-[11px] text-slate-400 font-medium truncate" id="drawerUserEmail">user@studio.com</p>
        </div>
      </div>

      <div class="space-y-1.5 pt-1">
        <a href="workspace.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-white/10 text-white font-bold text-xs border border-white/15">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
          <span>Workspace Home</span>
        </a>
        <a href="events.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-300 hover:bg-white/5 font-bold text-xs">
          <i data-lucide="folder" class="w-4 h-4 text-slate-400"></i>
          <span>All Events</span>
        </a>
      </div>
    </div>

    <div class="pt-4 border-t border-white/10">
      <button type="button" onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-full bg-red-500/15 text-red-400 border border-red-500/30 text-xs font-bold uppercase tracking-wider">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </aside>

  <!-- ================= CREATE EVENT MODAL ================= -->
  <div id="createModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="lunar-modal max-w-sm sm:max-w-md w-full rounded-[24px] p-5 sm:p-7 space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-white/10">
        <h3 class="font-cinematic text-xs font-bold text-white tracking-widest uppercase">New Event</h3>
        <button type="button" onclick="closeCreateModal()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="createEventForm" onsubmit="handleCreateEvent(event)" class="space-y-4">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">Collection Name</label>
          <input 
            type="text" 
            id="newEventName" 
            required 
            placeholder="e.g. Odyssey 2026" 
            class="w-full px-4 py-2.5 rounded-xl border border-white/15 bg-black/60 text-xs text-white placeholder-slate-500 outline-none focus:border-white/40"
          >
        </div>

        <div class="flex items-center justify-end gap-2 pt-1">
          <button type="button" onclick="closeCreateModal()" class="px-4 py-2 rounded-full border border-white/15 text-slate-300 text-xs font-bold">Cancel</button>
          <button type="submit" id="createSubmitBtn" class="px-5 py-2 rounded-full btn-lunar-primary text-xs font-bold uppercase tracking-wider">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= THREE.JS BACKGROUND ================= -->
  <script>
    const galaxyCanvas = document.getElementById('galaxyCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 48);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: galaxyCanvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const isMobile = window.innerWidth < 640;
    const parameters = {
      count: isMobile ? 18000 : 36000,
      size: isMobile ? 0.022 : 0.019,
      radius: 48,
      branches: 2,
      spin: 1.25,
      randomness: 0.62,
      power: 3.8,
      insideColor: '#ffffff',
      outsideColor: '#7aa2f7'
    };

    let geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(parameters.count * 3);
    const colors = new Float32Array(parameters.count * 3);
    const colorInside = new THREE.Color(parameters.insideColor);
    const colorOutside = new THREE.Color(parameters.outsideColor);

    for (let i = 0; i < parameters.count; i++) {
      const i3 = i * 3;
      const r = Math.random() * parameters.radius;
      const spinAngle = r * parameters.spin;
      const branchAngle = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;
      const randomX = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;
      const randomY = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * (r * 0.45);
      const randomZ = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;

      positions[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
      positions[i3 + 1] = randomY;
      positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

      const mixed = colorInside.clone().lerp(colorOutside, r / parameters.radius);
      colors[i3] = mixed.r;
      colors[i3 + 1] = mixed.g;
      colors[i3 + 2] = mixed.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: parameters.size,
      sizeAttenuation: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      transparent: true,
      opacity: 0.9
    });

    const points = new THREE.Points(geometry, material);
    points.rotation.x = 0.55;
    scene.add(points);

    let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
      }
    }, { passive: true });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();
    function animateGalaxy() {
      const elapsed = clock.getElapsedTime();
      if (points) {
        points.rotation.y = elapsed * 0.038;
        targetX += (mouseX * 0.2 - targetX) * 0.05;
        targetY += (mouseY * 0.15 - targetY) * 0.05;
        points.rotation.z = targetX;
        points.rotation.x = 0.55 + targetY;
      }
      renderer.render(scene, camera);
      requestAnimationFrame(animateGalaxy);
    }
    animateGalaxy();

    /* ================= LOGIC ================= */
    const token = localStorage.getItem('token') || localStorage.getItem('auth_token');
    const storedUser = localStorage.getItem('user') || localStorage.getItem('auth_user');
    let allEvents = [];

    if (!token && !window.location.pathname.includes('login') && !window.location.pathname.includes('index')) {
      window.location.replace('/index.html');
    }

    if (storedUser) {
      try {
        const u = JSON.parse(storedUser);
        document.getElementById('navUserName').innerText = u.name || 'Photographer';
        document.getElementById('navUserInitial').innerText = (u.name || 'P')[0].toUpperCase();
        document.getElementById('drawerUserName').innerText = u.name || 'Photographer';
        document.getElementById('drawerUserEmail').innerText = u.email || '';
        document.getElementById('drawerUserInitial').innerText = (u.name || 'P')[0].toUpperCase();
      } catch (e) {}
    }

    function toggleProfileSidebar(open) {
      const s = document.getElementById('profileSidebar');
      const b = document.getElementById('sidebarBackdrop');
      if (open) {
        b.classList.remove('hidden');
        setTimeout(() => { b.classList.remove('opacity-0'); s.classList.remove('translate-x-full'); }, 10);
      } else {
        s.classList.add('translate-x-full');
        b.classList.add('opacity-0');
        setTimeout(() => b.classList.add('hidden'), 300);
      }
    }

    async function loadUserGalleries() {
      try {
        const res = await fetch('/api/galleries', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.status === 401 || res.status === 403) return handleLogout();
        allEvents = await res.json();
        renderGalleries(allEvents);
      } catch (err) {}
    }

    function handleSearch(e) {
      const q = e.target.value.toLowerCase().trim();
      renderGalleries(!q ? allEvents : allEvents.filter(ev => (ev.name || ev.event_name || '').toLowerCase().includes(q)));
    }

    function goToEvent(id, slug) {
      window.location.href = `events.html?id=${id || slug}`;
    }

    function renderGalleries(events) {
      const grid = document.getElementById('eventsGrid');
      const emptyState = document.getElementById('emptyState');
      if (!events || events.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      grid.innerHTML = events.map(ev => {
        const title = ev.event_name || ev.name || 'Untitled Event';
        const id = ev.id || ev._id || '';
        const slug = ev.slug || id;
        const count = ev.photo_count || 0;
        return `
          <div class="lunar-panel-compact rounded-2xl p-4 sm:p-5 flex flex-col justify-between cursor-pointer group active:scale-[0.99] transition-all" onclick="goToEvent('${id}', '${slug}')">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2.5">
                <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[9px] font-bold uppercase ${count > 0 ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/15 text-amber-400 border border-amber-500/30'}">
                  <span class="w-1.5 h-1.5 rounded-full ${count > 0 ? 'bg-[#10b981]' : 'bg-amber-400'}"></span>
                  ${count > 0 ? 'INDEXED' : 'PENDING'}
                </span>
                <button type="button" onclick="event.stopPropagation(); deleteEvent('${id}', '${escapeHtml(title)}')" class="p-1.5 text-slate-400 hover:text-red-400">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
              <h3 class="font-cinematic text-xs sm:text-sm font-bold text-white tracking-widest uppercase group-hover:text-blue-400 transition truncate">
                ${escapeHtml(title)}
              </h3>
              <p class="text-[10px] sm:text-[11px] text-slate-400 mt-1">${count} indexed photos</p>
            </div>
          </div>
        `;
      }).join('');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
    function closeCreateModal() { document.getElementById('createModal').classList.add('hidden'); }

    async function handleCreateEvent(e) {
      e.preventDefault();
      const btn = document.getElementById('createSubmitBtn');
      const name = document.getElementById('newEventName').value.trim();
      btn.disabled = true;
      try {
        const res = await fetch('/api/galleries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (res.ok) {
          closeCreateModal();
          window.location.href = `events.html?id=${data.id || (data.gallery && data.gallery.id)}&autoUpload=true`;
        } else {
          alert(data.message || 'Error creating event');
        }
      } catch (err) {
        alert('Server unreachable');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteEvent(id, name) {
      if (!confirm(`Delete "${name}"?`)) return;
      try {
        await fetch(`/api/galleries/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        loadUserGalleries();
      } catch (e) {}
    }

    function handleLogout() {
      localStorage.clear();
      window.location.replace('/index.html');
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.innerText = t;
      return d.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      loadUserGalleries();
    });
  </script>
</body>
</html>
