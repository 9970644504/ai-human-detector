<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WORKSPACE.AI — Event Collections</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

    body {
      background-color: #000000;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: #f8fafc;
      overflow-x: hidden;
    }

    .font-cinematic {
      font-family: 'Syncopate', sans-serif;
      letter-spacing: 0.22em;
      font-weight: 400;
    }

    @media (max-width: 640px) {
      .font-cinematic {
        letter-spacing: 0.16em;
      }
    }

    #galaxyCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
      pointer-events: none;
    }

    .lunar-eclipse-horizon {
      position: fixed;
      top: -380px;
      left: 50%;
      transform: translateX(-50%);
      width: 130vw;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(12, 16, 26, 0.85) 0%, rgba(3, 5, 10, 0.95) 75%, rgba(0, 0, 0, 1) 100%);
      border-bottom: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 15px 80px rgba(255, 255, 255, 0.25), 0 35px 140px rgba(66, 133, 244, 0.25);
      z-index: 5;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .lunar-eclipse-horizon {
        top: -420px;
        width: 190vw;
      }
    }

    .lunar-nav {
      background: rgba(4, 6, 12, 0.65);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
    }

    .lunar-panel-compact {
      background: rgba(10, 14, 22, 0.07);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.24s cubic-bezier(0.2, 0, 0, 1);
    }

    .lunar-modal {
      background: rgba(8, 12, 20, 0.96);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.95);
    }

    .btn-lunar-action {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
    }

    .btn-lunar-primary {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
    }

    .google-border-top {
      background: linear-gradient(90deg, #4285f4 0%, #ea4335 25%, #fbbc05 50%, #34a853 75%, #4285f4 100%);
      height: 3px;
      width: 100%;
    }
  </style>
</head>
<body class="flex flex-col min-h-[100dvh] relative overflow-x-hidden">

  <canvas id="galaxyCanvas"></canvas>
  <div class="lunar-eclipse-horizon"></div>
  <div class="fixed top-0 left-0 right-0 z-50 google-border-top"></div>

  <!-- Header -->
  <header class="sticky top-0 z-40 lunar-nav mt-[3px]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between gap-3">
      
      <a href="workspace.html" class="inline-flex items-center gap-1.5 sm:gap-2 btn-lunar-action px-3 sm:px-4 py-2 rounded-full text-xs font-semibold tracking-wider">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-blue-400"></i>
        <span class="hidden xs:inline">WORKSPACE</span>
      </a>

      <h1 class="font-cinematic text-xs sm:text-base font-normal tracking-[0.2em] text-white uppercase text-center truncate max-w-[200px] sm:max-w-none sm:absolute sm:left-1/2 sm:-translate-x-1/2">
        COLLECTIONS
      </h1>

      <button onclick="fetchGalleries()" class="p-2 sm:p-2.5 rounded-full btn-lunar-action" title="Refresh">
        <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-slate-300"></i>
      </button>

    </div>
  </header>

  <!-- Container -->
  <main class="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 pt-16 sm:pt-28 pb-16 space-y-6">
    <div id="galleryContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  </main>

  <!-- Share QR Modal -->
  <div id="qrModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="lunar-modal max-w-xs w-full rounded-[24px] p-5 text-center space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-white/10">
        <h3 id="qrModalTitle" class="font-cinematic text-xs font-light text-white uppercase truncate">Event QR</h3>
        <button onclick="closeQrModal()" class="p-1 text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="p-3 bg-white rounded-xl flex justify-center">
        <div id="qrcode"></div>
      </div>
      <p class="text-[11px] text-slate-400 font-medium">Scan to open guest portal & match faces.</p>
      <button onclick="closeQrModal()" class="w-full py-2.5 rounded-full btn-lunar-primary text-xs font-bold uppercase tracking-wider">Close</button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="lunar-modal max-w-sm sm:max-w-md w-full rounded-[24px] p-5 sm:p-6 space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-white/10">
        <h3 id="uploadModalTitle" class="font-cinematic text-xs font-light text-white uppercase">Upload Payload</h3>
        <button onclick="closeUploadModal()" class="p-1 text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      
      <div class="flex gap-2 p-1 bg-white/5 border border-white/10 rounded-xl text-xs font-bold">
        <button id="tabFolder" onclick="switchUploadTab('folder')" class="flex-1 py-2 rounded-lg bg-white text-black shadow-sm text-center">Folder</button>
        <button id="tabZip" onclick="switchUploadTab('zip')" class="flex-1 py-2 rounded-lg text-slate-400 text-center">ZIP</button>
      </div>

      <div id="folderDropZone" class="relative border-2 border-dashed border-white/20 rounded-2xl p-5 text-center bg-white/5">
        <input type="file" id="folderInput" name="photos" accept="image/*" multiple webkitdirectory directory onchange="handleFileSelection(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
        <i data-lucide="folder-up" class="w-7 h-7 text-blue-400 mx-auto mb-1.5"></i>
        <p class="text-xs font-bold text-white">Select Folder</p>
        <p class="text-[10px] text-slate-400 mt-0.5">Direct image directory</p>
      </div>

      <div id="zipDropZone" class="hidden relative border-2 border-dashed border-white/20 rounded-2xl p-5 text-center bg-white/5">
        <input type="file" id="zipInput" name="zipFile" accept=".zip,application/zip" onchange="handleFileSelection(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
        <i data-lucide="archive" class="w-7 h-7 text-blue-400 mx-auto mb-1.5"></i>
        <p class="text-xs font-bold text-white">Select .ZIP Archive</p>
        <p class="text-[10px] text-slate-400 mt-0.5">Archive containing photos</p>
      </div>

      <div id="selectedFilesContainer" class="hidden space-y-1.5">
        <div class="flex items-center justify-between text-[10px] font-bold uppercase text-slate-400">
          <span>Payload:</span>
          <span id="selectedFileSummary" class="text-white bg-white/10 px-2 py-0.5 rounded-full">0 items</span>
        </div>
        <div id="selectedFileList" class="max-h-28 overflow-y-auto space-y-1 p-2 rounded-lg bg-black/50 border border-white/10 text-[11px] text-slate-300"></div>
      </div>

      <div class="flex justify-end gap-2 pt-1 border-t border-white/10">
        <button onclick="closeUploadModal()" class="px-4 py-2 rounded-full text-xs font-bold border border-white/15 text-slate-300">Cancel</button>
        <button id="uploadSubmitBtn" onclick="submitBatchUpload()" class="px-5 py-2 rounded-full btn-lunar-primary text-xs font-bold uppercase tracking-wider">Process</button>
      </div>
    </div>
  </div>

  <!-- Three.js Background -->
  <script>
    const galaxyCanvas = document.getElementById('galaxyCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 48);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: galaxyCanvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const isMobile = window.innerWidth < 640;
    const parameters = { count: isMobile ? 18000 : 36000, size: isMobile ? 0.022 : 0.019, radius: 48, branches: 2, spin: 1.25, randomness: 0.62, power: 3.8 };

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(parameters.count * 3);
    const colors = new Float32Array(parameters.count * 3);
    const cInside = new THREE.Color('#ffffff');
    const cOutside = new THREE.Color('#7aa2f7');

    for (let i = 0; i < parameters.count; i++) {
      const i3 = i * 3;
      const r = Math.random() * parameters.radius;
      const spin = r * parameters.spin;
      const branch = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;
      positions[i3] = Math.cos(branch + spin) * r + Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;
      positions[i3 + 1] = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * (r * 0.45);
      positions[i3 + 2] = Math.sin(branch + spin) * r + Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;
      const mixed = cInside.clone().lerp(cOutside, r / parameters.radius);
      colors[i3] = mixed.r; colors[i3 + 1] = mixed.g; colors[i3 + 2] = mixed.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const points = new THREE.Points(geometry, new THREE.PointsMaterial({ size: parameters.size, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true, transparent: true, opacity: 0.9 }));
    points.rotation.x = 0.55;
    scene.add(points);

    let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
    window.addEventListener('mousemove', (e) => { mouseX = (e.clientX / window.innerWidth - 0.5) * 2; mouseY = (e.clientY / window.innerHeight - 0.5) * 2; });
    window.addEventListener('touchmove', (e) => { if (e.touches.length) { mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2; mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2; } }, { passive: true });
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

    const clock = new THREE.Clock();
    function animate() {
      points.rotation.y = clock.getElapsedTime() * 0.038;
      targetX += (mouseX * 0.2 - targetX) * 0.05;
      targetY += (mouseY * 0.15 - targetY) * 0.05;
      points.rotation.z = targetX;
      points.rotation.x = 0.55 + targetY;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    /* ================= LOGIC ================= */
    let activeUploadGalleryId = null;
    let activeTab = 'folder';
    const token = localStorage.getItem('token') || localStorage.getItem('auth_token');

    if (!token && !window.location.pathname.includes('login') && !window.location.pathname.includes('index')) {
      window.location.replace('/index.html');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await fetchGalleries();
      const p = new URLSearchParams(window.location.search);
      if (p.get('autoUpload') === 'true' && p.get('id')) {
        openUploadModal(p.get('id'), decodeURIComponent(p.get('name') || 'New Event'));
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    function switchUploadTab(type) {
      activeTab = type;
      document.getElementById('tabFolder').className = `flex-1 py-2 rounded-lg text-center ${type === 'folder' ? 'bg-white text-black font-bold' : 'text-slate-400'}`;
      document.getElementById('tabZip').className = `flex-1 py-2 rounded-lg text-center ${type === 'zip' ? 'bg-white text-black font-bold' : 'text-slate-400'}`;
      document.getElementById('folderDropZone').classList.toggle('hidden', type !== 'folder');
      document.getElementById('zipDropZone').classList.toggle('hidden', type !== 'zip');
      document.getElementById('selectedFilesContainer').classList.add('hidden');
    }

    function handleFileSelection(e) {
      const files = e.target.files;
      const preview = document.getElementById('selectedFilesContainer');
      const list = document.getElementById('selectedFileList');
      if (!files || !files.length) return preview.classList.add('hidden');
      preview.classList.remove('hidden');
      document.getElementById('selectedFileSummary').innerText = `${files.length} items`;
      list.innerHTML = Array.from(files).slice(0, 5).map(f => `
        <div class="flex items-center justify-between truncate py-0.5">
          <span class="truncate">${f.name}</span>
          <span class="text-slate-500 shrink-0 ml-2">${(f.size / (1024 * 1024)).toFixed(1)}MB</span>
        </div>
      `).join('');
    }

    async function fetchGalleries() {
      const c = document.getElementById('galleryContainer');
      try {
        const res = await fetch('/api/galleries', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.status === 401 || res.status === 403) return window.location.replace('/index.html');
        const galleries = await res.json();
        c.innerHTML = '';
        if (!galleries || !galleries.length) {
          c.innerHTML = `<div class="lunar-panel-compact rounded-2xl text-center py-12 text-slate-400 text-xs col-span-full">No collections found.</div>`;
          return;
        }

        galleries.forEach(g => {
          const title = g.event_name || g.name || 'Untitled';
          const id = String(g.id || g._id);
          const shareUrl = `${window.location.origin}/gallery.html?slug=${encodeURIComponent(g.slug || id)}`;
          const card = document.createElement('div');
          card.className = "lunar-panel-compact rounded-2xl p-4 sm:p-5 flex flex-col justify-between space-y-3 relative group";
          card.onclick = () => window.location.href = `event-detail.html?id=${id}`;

          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[9px] font-bold uppercase bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> READY
                </span>
                <div class="flex items-center gap-1">
                  <button type="button" onclick="event.stopPropagation(); openUploadModal('${id}', '${escapeHtml(title)}')" class="p-1.5 text-slate-400 hover:text-white" title="Upload">
                    <i data-lucide="folder-up" class="w-3.5 h-3.5"></i>
                  </button>
                  <button type="button" onclick="event.stopPropagation(); deleteGallery('${id}', '${escapeHtml(title)}')" class="p-1.5 text-slate-400 hover:text-red-400" title="Delete">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
              <h3 class="font-cinematic text-xs sm:text-sm font-light text-white uppercase truncate">${escapeHtml(title)}</h3>
              <p class="text-[10px] sm:text-[11px] text-slate-400 mt-0.5">${g.photo_count || 0} indexed photos</p>
            </div>
            <div class="pt-2.5 border-t border-white/10 flex items-center gap-2" onclick="event.stopPropagation()">
              <button onclick="copyLink('${shareUrl}')" class="btn-lunar-action flex-1 py-1.5 px-3 rounded-full text-[11px] font-semibold flex items-center justify-center gap-1">
                <i data-lucide="copy" class="w-3 h-3 text-blue-400"></i> Copy Link
              </button>
              <button onclick="openQrModal('${escapeHtml(title)}', '${shareUrl}')" class="btn-lunar-action p-1.5 rounded-full">
                <i data-lucide="qr-code" class="w-3.5 h-3.5 text-blue-400"></i>
              </button>
            </div>
          `;
          c.appendChild(card);
        });
        if (typeof lucide !== 'undefined') lucide.createIcons();
      } catch (err) {}
    }

    function openQrModal(name, url) {
      document.getElementById('qrModalTitle').innerText = name;
      const q = document.getElementById('qrcode');
      q.innerHTML = '';
      new QRCode(q, { text: url, width: 140, height: 140 });
      document.getElementById('qrModal').classList.remove('hidden');
    }
    function closeQrModal() { document.getElementById('qrModal').classList.add('hidden'); }

    function openUploadModal(id, name) {
      activeUploadGalleryId = id;
      document.getElementById('uploadModalTitle').innerText = name;
      document.getElementById('uploadModal').classList.remove('hidden');
      switchUploadTab('folder');
    }
    function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

    async function submitBatchUpload() {
      if (!activeUploadGalleryId) return;
      const isZip = activeTab === 'zip';
      const input = document.getElementById(isZip ? 'zipInput' : 'folderInput');
      if (!input.files.length) return alert('Select file first');
      const form = new FormData();
      if (isZip) form.append('zipFile', input.files[0]);
      else {
        form.append('folderName', input.files[0].webkitRelativePath?.split('/')[0] || 'Photos');
        Array.from(input.files).forEach(f => form.append('photos', f));
      }
      const btn = document.getElementById('uploadSubmitBtn');
      btn.innerText = 'Indexing...'; btn.disabled = true;
      try {
        await fetch(`/api/galleries/${activeUploadGalleryId}/${isZip ? 'upload-zip' : 'upload-photos'}`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form
        });
        closeUploadModal();
        fetchGalleries();
      } catch (e) {
        alert('Upload failed');
      } finally {
        btn.innerText = 'Process'; btn.disabled = false;
      }
    }

    async function deleteGallery(id, name) {
      if (!confirm(`Delete "${name}"?`)) return;
      await fetch(`/api/galleries/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
      fetchGalleries();
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => alert('Guest Link Copied!'));
    }

    function escapeHtml(t) {
      const d = document.createElement('div'); d.innerText = t; return d.innerHTML;
    }
  </script>
</body>
</html>
