<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WORKSPACE.AI — Event Collections</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="editorial.css">
  <link rel="stylesheet" href="bg-scroll.css">
</head>
<body class="editorial min-h-screen">

  <!-- SCROLLING PHOTO-WALL BACKGROUND -->
  <div id="bgScrollRoot"></div>

  <!-- ================= TOP NAV ================= -->
  <header class="nav-editorial">
    <div class="nav-editorial-inner">
      <div class="nav-logo"><div class="nav-logo-mark"><i data-lucide="aperture" class="w-3.5 h-3.5"></i></div><span class="nav-logo-text">WORKSPACE.AI</span></div>

      <nav class="nav-links hidden sm:flex">
        <a href="/workspace.html">Home</a>
        <a href="/events.html" class="active">Collections</a>
      </nav>

      <div class="nav-actions">
        <button onclick="fetchGalleries()" class="p-2 rounded-full border border-gray-200 text-gray-500" title="Refresh">
          <i data-lucide="rotate-cw" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= HERO HEADLINE ================= -->
  <section class="editorial-hero">
    <h1 class="headline-thin">COLLECTIONS</h1>
    <span class="tag-bracket" id="collectionsSubtitle">[ every event gallery you've created ]</span>
  </section>

  <!-- Container -->
  <main class="max-w-[1400px] mx-auto px-6 pb-24">
    <div id="galleryContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  </main>

  <!-- Share QR Modal -->
  <div id="qrModal" class="hidden fixed inset-0 z-50 bg-gray-900/40 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="modal-3d max-w-xs w-full rounded-[10px] p-5 text-center space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-gray-100">
        <h3 id="qrModalTitle" class="editorial-title text-sm truncate">Event QR</h3>
        <button onclick="closeQrModal()" class="p-1 text-gray-400 hover:text-gray-700"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="p-3 bg-white rounded-xl flex justify-center border border-gray-100">
        <div id="qrcode"></div>
      </div>
      <p class="text-[11px] text-gray-500 font-medium">Scan to open guest portal & match faces.</p>
      <button onclick="closeQrModal()" class="w-full py-2.5 rounded-full btn-editorial">Close</button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="hidden fixed inset-0 z-50 bg-gray-900/40 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="modal-3d max-w-sm sm:max-w-md w-full rounded-[10px] p-5 sm:p-6 space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-gray-100">
        <h3 id="uploadModalTitle" class="editorial-title text-sm">Upload Payload</h3>
        <button onclick="closeUploadModal()" class="p-1 text-gray-400 hover:text-gray-700"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>

      <div class="flex gap-2 p-1 bg-gray-100 border border-gray-200 rounded-xl text-xs font-bold">
        <button id="tabFolder" onclick="switchUploadTab('folder')" class="flex-1 py-2 rounded-lg bg-white text-gray-900 shadow-sm text-center">Folder</button>
        <button id="tabZip" onclick="switchUploadTab('zip')" class="flex-1 py-2 rounded-lg text-gray-500 text-center">ZIP</button>
      </div>

      <div id="folderDropZone" class="relative border-2 border-dashed border-gray-300 rounded-2xl p-5 text-center bg-gray-50">
        <input type="file" id="folderInput" name="photos" accept="image/*" multiple webkitdirectory directory onchange="handleFileSelection(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
        <i data-lucide="folder-up" class="w-7 h-7 text-gray-700 mx-auto mb-1.5"></i>
        <p class="text-xs font-bold text-gray-900">Select Folder</p>
        <p class="text-[10px] text-gray-500 mt-0.5">Direct image directory</p>
      </div>

      <div id="zipDropZone" class="hidden relative border-2 border-dashed border-gray-300 rounded-2xl p-5 text-center bg-gray-50">
        <input type="file" id="zipInput" name="zipFile" accept=".zip,application/zip" onchange="handleFileSelection(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
        <i data-lucide="archive" class="w-7 h-7 text-gray-700 mx-auto mb-1.5"></i>
        <p class="text-xs font-bold text-gray-900">Select .ZIP Archive</p>
        <p class="text-[10px] text-gray-500 mt-0.5">Archive containing photos</p>
      </div>

      <div id="selectedFilesContainer" class="hidden space-y-1.5">
        <div class="flex items-center justify-between text-[10px] font-bold uppercase text-gray-500">
          <span>Payload:</span>
          <span id="selectedFileSummary" class="text-gray-900 bg-gray-100 px-2 py-0.5 rounded-full">0 items</span>
        </div>
        <div id="selectedFileList" class="max-h-28 overflow-y-auto space-y-1 p-2 rounded-lg bg-gray-50 border border-gray-200 text-[11px] text-gray-600"></div>
      </div>

      <div class="flex justify-end gap-2 pt-1 border-t border-gray-100">
        <button onclick="closeUploadModal()" class="px-4 py-2 rounded-full text-xs font-bold border border-gray-200 text-gray-600">Cancel</button>
        <button id="uploadSubmitBtn" onclick="submitBatchUpload()" class="px-5 py-2 rounded-full btn-editorial">Process</button>
      </div>
    </div>
  </div>

  <!-- ================= LOGIC ================= -->
  <script>
    let activeUploadGalleryId = null;
    let activeTab = 'folder';
    const token = localStorage.getItem('token') || localStorage.getItem('auth_token');

    if (!token && !window.location.pathname.includes('login') && !window.location.pathname.includes('index')) {
      window.location.replace('/index.html');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      await fetchGalleries();
      const p = new URLSearchParams(window.location.search);
      if (p.get('autoUpload') === 'true' && p.get('id')) {
        openUploadModal(p.get('id'), decodeURIComponent(p.get('name') || 'New Event'));
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    function switchUploadTab(type) {
      activeTab = type;
      document.getElementById('tabFolder').className = `flex-1 py-2 rounded-lg text-center ${type === 'folder' ? 'bg-white text-gray-900 shadow-sm font-bold' : 'text-gray-500'}`;
      document.getElementById('tabZip').className = `flex-1 py-2 rounded-lg text-center ${type === 'zip' ? 'bg-white text-gray-900 shadow-sm font-bold' : 'text-gray-500'}`;
      document.getElementById('folderDropZone').classList.toggle('hidden', type !== 'folder');
      document.getElementById('zipDropZone').classList.toggle('hidden', type !== 'zip');
      document.getElementById('selectedFilesContainer').classList.add('hidden');
    }

    function handleFileSelection(e) {
      const files = e.target.files;
      const preview = document.getElementById('selectedFilesContainer');
      const list = document.getElementById('selectedFileList');
      if (!files || !files.length) return preview.classList.add('hidden');
      preview.classList.remove('hidden');
      document.getElementById('selectedFileSummary').innerText = `${files.length} items`;
      list.innerHTML = Array.from(files).slice(0, 5).map(f => `
        <div class="flex items-center justify-between truncate py-0.5">
          <span class="truncate">${f.name}</span>
          <span class="text-gray-400 shrink-0 ml-2">${(f.size / (1024 * 1024)).toFixed(1)}MB</span>
        </div>
      `).join('');
    }

    async function fetchGalleries() {
      const c = document.getElementById('galleryContainer');
      try {
        const res = await fetch('/api/galleries', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.status === 401 || res.status === 403) return window.location.replace('/index.html');
        const galleries = await res.json();
        c.innerHTML = '';
        document.getElementById('collectionsSubtitle').innerText = `[ ${galleries.length} collection${galleries.length === 1 ? '' : 's'} ]`;
        if (!galleries || !galleries.length) {
          c.innerHTML = `<div class="editorial-card text-center py-12 text-gray-500 text-xs col-span-full">No collections found.</div>`;
          return;
        }

        galleries.forEach(g => {
          const title = g.event_name || g.name || 'Untitled';
          const id = String(g.id || g._id);
          const shareUrl = `${window.location.origin}/gallery.html?slug=${encodeURIComponent(g.slug || id)}`;
          const card = document.createElement('div');
          card.className = 'editorial-card flex flex-col justify-between cursor-pointer group';
          card.onclick = () => window.location.href = `event-detail.html?id=${id}`;

          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="editorial-label inline-flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Ready
                </span>
                <div class="flex items-center gap-1">
                  <button type="button" onclick="event.stopPropagation(); openUploadModal('${id}', '${escapeHtml(title)}')" class="p-1.5 text-gray-400 hover:text-gray-800" title="Upload">
                    <i data-lucide="folder-up" class="w-3.5 h-3.5"></i>
                  </button>
                  <button type="button" onclick="event.stopPropagation(); deleteGallery('${id}', '${escapeHtml(title)}')" class="p-1.5 text-gray-400 hover:text-red-500" title="Delete">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
              <h3 class="editorial-title truncate">${escapeHtml(title)}</h3>
              <p class="text-[11px] text-gray-500 mt-1">${g.photo_count || 0} indexed photos</p>
            </div>
            <div class="pt-3 mt-4 border-t border-gray-100 flex items-center gap-2" onclick="event.stopPropagation()">
              <button onclick="copyLink('${shareUrl}')" class="flex-1 py-1.5 px-3 rounded-full border border-gray-200 text-[11px] font-semibold flex items-center justify-center gap-1 hover:bg-gray-50">
                <i data-lucide="copy" class="w-3 h-3"></i> Copy Link
              </button>
              <button onclick="openQrModal('${escapeHtml(title)}', '${shareUrl}')" class="p-1.5 rounded-full border border-gray-200 hover:bg-gray-50">
                <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          `;
          c.appendChild(card);
        });
        if (typeof lucide !== 'undefined') lucide.createIcons();
      } catch (err) {}
    }

    function openQrModal(name, url) {
      document.getElementById('qrModalTitle').innerText = name;
      const q = document.getElementById('qrcode');
      q.innerHTML = '';
      new QRCode(q, { text: url, width: 140, height: 140 });
      document.getElementById('qrModal').classList.remove('hidden');
    }
    function closeQrModal() { document.getElementById('qrModal').classList.add('hidden'); }

    function openUploadModal(id, name) {
      activeUploadGalleryId = id;
      document.getElementById('uploadModalTitle').innerText = name;
      document.getElementById('uploadModal').classList.remove('hidden');
      switchUploadTab('folder');
    }
    function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

    async function submitBatchUpload() {
      if (!activeUploadGalleryId) return;
      const isZip = activeTab === 'zip';
      const input = document.getElementById(isZip ? 'zipInput' : 'folderInput');
      if (!input.files.length) return alert('Select file first');
      const form = new FormData();
      if (isZip) form.append('zipFile', input.files[0]);
      else {
        form.append('folderName', input.files[0].webkitRelativePath?.split('/')[0] || 'Photos');
        Array.from(input.files).forEach(f => form.append('photos', f));
      }
      const btn = document.getElementById('uploadSubmitBtn');
      btn.innerText = 'Indexing...'; btn.disabled = true;
      try {
        await fetch(`/api/galleries/${activeUploadGalleryId}/${isZip ? 'upload-zip' : 'upload-photos'}`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: form
        });
        closeUploadModal();
        fetchGalleries();
      } catch (e) {
        alert('Upload failed');
      } finally {
        btn.innerText = 'Process'; btn.disabled = false;
      }
    }

    async function deleteGallery(id, name) {
      if (!confirm(`Delete "${name}"?`)) return;
      await fetch(`/api/galleries/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
      fetchGalleries();
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => alert('Guest Link Copied!'));
    }

    function escapeHtml(t) {
      const d = document.createElement('div'); d.innerText = t; return d.innerHTML;
    }
  </script>
  <script src="bg-scroll.js"></script>
</body>
</html>
