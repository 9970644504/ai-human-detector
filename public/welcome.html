<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKSPACE.AI — Welcome Back</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

    body {
      background-color: #000000;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      color: #f8fafc;
      overflow: hidden;
    }

    .font-cinematic {
      font-family: 'Syncopate', sans-serif;
      letter-spacing: 0.25em;
      font-weight: 400;
    }

    /* Fixed WebGL 3D Galaxy Canvas */
    #galaxyCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Cinematic Lunar Horizon / Planetary Eclipse Curve */
    .lunar-eclipse-horizon {
      position: fixed;
      top: -380px;
      left: 50%;
      transform: translateX(-50%);
      width: 130vw;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(12, 16, 26, 0.85) 0%, rgba(3, 5, 10, 0.95) 75%, rgba(0, 0, 0, 1) 100%);
      border-bottom: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 15px 80px rgba(255, 255, 255, 0.25), 0 35px 140px rgba(66, 133, 244, 0.25);
      z-index: 5;
      pointer-events: none;
    }

    /* Google 4-Color Top Accent Line */
    .google-border-top {
      background: linear-gradient(90deg, #4285f4 0%, #ea4335 25%, #fbbc05 50%, #34a853 75%, #4285f4 100%);
      height: 3px;
      width: 100%;
    }

    /* Transparent Lunar Glass Card */
    .lunar-welcome-card {
      background: rgba(10, 14, 22, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Smooth Cinematic Entrance & Fade-out */
    @keyframes cinematicEntrance {
      0% {
        opacity: 0;
        filter: blur(14px);
        transform: translateY(24px) scale(0.96);
      }
      20%, 82% {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0px) scale(1);
      }
      100% {
        opacity: 0;
        filter: blur(16px);
        transform: translateY(-16px) scale(1.02);
      }
    }

    .animate-cinematic {
      animation: cinematicEntrance 2.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Luminous Sweep Progress Bar */
    @keyframes sweepGlow {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(30%); }
      100% { transform: translateX(100%); }
    }

    .sweep-bar {
      height: 3px;
      width: 170px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
      border-radius: 9999px;
    }

    .sweep-bar::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 55%;
      background: linear-gradient(90deg, #4285f4 0%, #a855f7 40%, #38bdf8 80%, #ffffff 100%);
      animation: sweepGlow 1.4s infinite ease-in-out;
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(66, 133, 244, 0.8);
    }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-6 select-none relative overflow-hidden">

  <!-- 3D LIVE THREE.JS ROTATING MILKY WAY CANVAS -->
  <canvas id="galaxyCanvas"></canvas>

  <!-- LUNAR CRESCENT PLANETARY HORIZON -->
  <div class="lunar-eclipse-horizon"></div>

  <!-- TOP ACCENT LINE -->
  <div class="fixed top-0 left-0 right-0 z-50 google-border-top"></div>

  <!-- Animated Greeting Glass Card -->
  <div class="relative z-10 animate-cinematic max-w-sm sm:max-w-md w-full lunar-welcome-card rounded-[2.5rem] p-8 sm:p-11 text-center space-y-6 flex flex-col items-center shadow-2xl">
    
    <!-- Camera Aperture Brand Logo Badge -->
    <div class="relative w-14 h-14 rounded-2xl p-[1.5px] bg-gradient-to-tr from-[#4285F4] via-[#EA4335] to-[#34A853] shadow-lg shadow-white/5">
      <div class="w-full h-full rounded-[14px] bg-black flex items-center justify-center p-2 overflow-hidden">
        <svg class="w-full h-full" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="16" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="2 2" />
          <line x1="24" y1="11" x2="33" y2="17" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
          <line x1="33" y1="17" x2="27" y2="21" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
          <line x1="37" y1="24" x2="31" y2="33" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" />
          <line x1="31" y1="33" x2="27" y2="27" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" />
          <line x1="24" y1="37" x2="15" y2="31" stroke="#34A853" stroke-width="3" stroke-linecap="round" />
          <line x1="15" y1="31" x2="21" y2="27" stroke="#34A853" stroke-width="3" stroke-linecap="round" />
          <line x1="11" y1="24" x2="17" y2="15" stroke="#4285F4" stroke-width="3" stroke-linecap="round" />
          <line x1="17" y1="15" x2="21" y2="21" stroke="#4285F4" stroke-width="3" stroke-linecap="round" />
          <circle cx="24" cy="24" r="4.5" fill="#4285F4" />
          <circle cx="24" cy="24" r="2" fill="#ffffff" opacity="0.9" />
        </svg>
      </div>
    </div>

    <!-- Status Pill -->
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-slate-300 text-[10px] font-bold uppercase tracking-widest">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      Face Index Studio
    </div>

    <!-- Greeting Headings -->
    <div class="space-y-2 pt-1">
      <h1 class="font-cinematic text-lg sm:text-2xl font-light text-white tracking-[0.25em] uppercase drop-shadow-md">
        WELCOME BACK
      </h1>
      <p class="text-xs text-blue-400 font-semibold tracking-wider uppercase" id="welcomeUserGreeting">
        To Workspace
      </p>
    </div>

    <!-- Animated Progress Bar & Subtext -->
    <div class="flex flex-col items-center gap-2 pt-2">
      <div class="sweep-bar"></div>
      <span class="text-[11px] text-slate-400 font-medium tracking-wide pt-1">Initializing your workspace...</span>
    </div>

  </div>

  <!-- ================= THREE.JS 3D MILKY WAY SIMULATION ================= -->
  <script>
    const galaxyCanvas = document.getElementById('galaxyCanvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 30, 48);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: galaxyCanvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const parameters = {
      count: 36000,
      size: 0.019,
      radius: 48,
      branches: 2,
      spin: 1.25,
      randomness: 0.62,
      power: 3.8,
      insideColor: '#ffffff',
      outsideColor: '#7aa2f7'
    };

    let geometry = null;
    let material = null;
    let points = null;

    function generateMilkyWay() {
      geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(parameters.count * 3);
      const colors = new Float32Array(parameters.count * 3);

      const colorInside = new THREE.Color(parameters.insideColor);
      const colorOutside = new THREE.Color(parameters.outsideColor);
      const dustSilver = new THREE.Color('#cbd5e1');

      for (let i = 0; i < parameters.count; i++) {
        const i3 = i * 3;

        const r = Math.random() * parameters.radius;
        const spinAngle = r * parameters.spin;
        const branchAngle = ((i % parameters.branches) / parameters.branches) * Math.PI * 2;

        const randomX = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;
        const randomY = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * (r * 0.45);
        const randomZ = Math.pow(Math.random(), parameters.power) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * r;

        positions[i3] = Math.cos(branchAngle + spinAngle) * r + randomX;
        positions[i3 + 1] = randomY;
        positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

        const mixedColor = colorInside.clone();
        mixedColor.lerp(colorOutside, r / parameters.radius);
        if (r > 6 && r < 20 && Math.random() > 0.6) mixedColor.lerp(dustSilver, 0.4);

        colors[i3] = mixedColor.r;
        colors[i3 + 1] = mixedColor.g;
        colors[i3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      material = new THREE.PointsMaterial({
        size: parameters.size,
        sizeAttenuation: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexColors: true,
        transparent: true,
        opacity: 0.9
      });

      points = new THREE.Points(geometry, material);
      points.rotation.x = 0.55;
      scene.add(points);
    }
    generateMilkyWay();

    let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();
    function animateGalaxy() {
      const elapsedTime = clock.getElapsedTime();
      if (points) {
        points.rotation.y = elapsedTime * 0.038;
        targetX += (mouseX * 0.2 - targetX) * 0.05;
        targetY += (mouseY * 0.15 - targetY) * 0.05;
        points.rotation.z = targetX;
        points.rotation.x = 0.55 + targetY;
      }
      renderer.render(scene, camera);
      requestAnimationFrame(animateGalaxy);
    }
    animateGalaxy();
  </script>

  <!-- ================= TRANSITION LOGIC ================= -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();

      // Read authenticated photographer's name from storage if available
      try {
        const storedUser = localStorage.getItem('user') || localStorage.getItem('auth_user');
        if (storedUser) {
          const user = JSON.parse(storedUser);
          if (user && user.name) {
            document.getElementById('welcomeUserGreeting').innerText = `To Workspace, ${user.name}`;
          }
        }
      } catch (err) {
        console.warn('Could not read user name', err);
      }

      // Smooth transition to workspace dashboard
      setTimeout(() => {
        window.location.replace('/workspace.html');
      }, 2700);
    });
  </script>
</body>
</html>
