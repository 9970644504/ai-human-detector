<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKSPACE.AI — Portal Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="bg-scroll.css">
  <style>
    body { --bg-scroll-tint: rgba(238, 242, 250, 0.5); }
  </style>
</head>
<body class="flex items-center justify-center p-4 min-h-screen relative overflow-x-hidden">

  <!-- SCROLLING PHOTO-WALL BACKGROUND -->
  <div id="bgScrollRoot"></div>

  <!-- TOP ACCENT LINE -->
  <div class="fixed top-0 left-0 right-0 z-50 google-border-top"></div>

  <!-- Auth Card Container -->
  <div class="modal-3d w-full max-w-md rounded-[2.5rem] p-8 relative space-y-6 z-10">

    <!-- Header -->
    <div class="text-center space-y-3">
      <div class="relative w-14 h-14 mx-auto rounded-2xl p-[1.5px] bg-gray-900 logo-badge-3d float-3d">
        <div class="w-full h-full rounded-[14px] bg-white flex items-center justify-center p-2 overflow-hidden text-gray-900">
          <i data-lucide="aperture" class="w-6 h-6"></i>
        </div>
      </div>
      <h2 class="font-cinematic text-lg sm:text-xl tracking-[0.1em] text-gray-900 uppercase" id="formTitle">SIGN IN</h2>
      <p class="text-xs text-gray-500 font-medium" id="formSubtitle">Access your studio collections & face recognition pipeline</p>
    </div>

    <!-- Toggle Tabs -->
    <div class="flex p-1 bg-gray-100 border border-gray-200 rounded-2xl text-xs font-bold">
      <button type="button" onclick="switchTab('signin')" id="tabSignIn" class="flex-1 py-2.5 rounded-xl bg-white text-gray-900 shadow-sm transition cursor-pointer">Sign In</button>
      <button type="button" onclick="switchTab('register')" id="tabRegister" class="flex-1 py-2.5 rounded-xl text-gray-500 hover:text-gray-900 transition cursor-pointer">Create Account</button>
    </div>

    <!-- Error Alert Box -->
    <div id="errorAlert" class="hidden p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-600 text-xs font-semibold text-center leading-relaxed"></div>

    <!-- Auth Form -->
    <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">

      <!-- Full Name (Register Only) -->
      <div id="nameField" class="hidden space-y-1.5">
        <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-500">Full Name</label>
        <div class="relative flex items-center">
          <i data-lucide="user" class="w-4 h-4 text-gray-400 absolute left-3.5 pointer-events-none"></i>
          <input type="text" id="nameInput" placeholder="e.g. Studio Name" class="w-full pl-10 pr-4 py-3 input-3d rounded-xl outline-none text-xs sm:text-sm text-gray-900 placeholder-gray-400 font-medium">
        </div>
      </div>

      <!-- Email Address -->
      <div class="space-y-1.5">
        <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-500">Email Address</label>
        <div class="relative flex items-center">
          <i data-lucide="mail" class="w-4 h-4 text-gray-400 absolute left-3.5 pointer-events-none"></i>
          <input type="email" id="emailInput" required placeholder="photographer@studio.com" class="w-full pl-10 pr-4 py-3 input-3d rounded-xl outline-none text-xs sm:text-sm text-gray-900 placeholder-gray-400 font-medium">
        </div>
      </div>

      <!-- Password -->
      <div class="space-y-1.5">
        <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-500">Password</label>
        <div class="relative flex items-center">
          <i data-lucide="lock" class="w-4 h-4 text-gray-400 absolute left-3.5 pointer-events-none"></i>
          <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 input-3d rounded-xl outline-none text-xs sm:text-sm text-gray-900 placeholder-gray-400 font-medium">
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full py-3.5 rounded-full btn-3d-primary font-bold text-xs tracking-wider uppercase flex items-center justify-center gap-2 cursor-pointer mt-3">
        <span id="submitBtnText">Sign In to Workspace</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>

    </form>

  </div>

  <script src="bg-scroll.js"></script>

  <!-- ================= AUTH LOGIC SCRIPT ================= -->
  <script>
    let mode = 'signin';

    function switchTab(newMode) {
      mode = newMode;
      const errorBox = document.getElementById('errorAlert');
      errorBox.classList.add('hidden');
      errorBox.innerText = '';

      const tabSignIn = document.getElementById('tabSignIn');
      const tabRegister = document.getElementById('tabRegister');
      const nameField = document.getElementById('nameField');
      const nameInput = document.getElementById('nameInput');
      const formTitle = document.getElementById('formTitle');
      const formSubtitle = document.getElementById('formSubtitle');
      const submitBtnText = document.getElementById('submitBtnText');

      if (mode === 'signin') {
        tabSignIn.className = 'flex-1 py-2.5 rounded-xl bg-white text-black shadow-sm font-bold transition';
        tabRegister.className = 'flex-1 py-2.5 rounded-xl text-slate-400 hover:text-white font-bold transition';
        nameField.classList.add('hidden');
        nameInput.removeAttribute('required');
        formTitle.innerText = 'SIGN IN';
        formSubtitle.innerText = 'Access your studio collections & face recognition pipeline';
        submitBtnText.innerText = 'Sign In to Workspace';
      } else {
        tabRegister.className = 'flex-1 py-2.5 rounded-xl bg-white text-black shadow-sm font-bold transition';
        tabSignIn.className = 'flex-1 py-2.5 rounded-xl text-slate-400 hover:text-white font-bold transition';
        nameField.classList.remove('hidden');
        nameInput.setAttribute('required', 'true');
        formTitle.innerText = 'CREATE ACCOUNT';
        formSubtitle.innerText = 'Register as a photographer to host and manage galleries';
        submitBtnText.innerText = 'Register Account';
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      e.stopPropagation();

      const errorBox = document.getElementById('errorAlert');
      const submitBtn = document.getElementById('submitBtn');
      errorBox.classList.add('hidden');

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const name = document.getElementById('nameInput').value.trim();

      const endpoint = mode === 'signin' ? '/api/auth/login' : '/api/auth/register';
      const payload = mode === 'signin' 
        ? { email, password } 
        : { name, email, password };

      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('auth_user', JSON.stringify(data.user));
          sessionStorage.clear();

          window.location.replace('/welcome.html');
        } else {
          errorBox.innerText = data.message || (mode === 'signin' ? 'Sign in failed.' : 'Registration failed.');
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.innerText = 'Network error. Please make sure the server is running.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      const token = localStorage.getItem('token') || localStorage.getItem('auth_token');
      if (token) {
        window.location.replace('welcome.html');
      }
    });
  </script>
</body>
</html>
