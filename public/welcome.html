<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKSPACE.AI — Welcome Back</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="bg-scroll.css">
  <style>
    body { overflow: hidden; --bg-scroll-tint: rgba(238, 242, 250, 0.5); }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-6 select-none relative overflow-hidden">

  <!-- SCROLLING PHOTO-WALL BACKGROUND -->
  <div id="bgScrollRoot"></div>

  <!-- TOP ACCENT LINE -->
  <div class="fixed top-0 left-0 right-0 z-50 google-border-top"></div>

  <!-- Animated Greeting Card -->
  <div class="relative z-10 animate-light-entrance max-w-sm sm:max-w-md w-full panel-3d rounded-[2.5rem] p-8 sm:p-11 text-center space-y-6 flex flex-col items-center">

    <!-- Camera Aperture Brand Logo Badge -->
    <div class="relative w-14 h-14 rounded-2xl p-[1.5px] bg-gray-900 logo-badge-3d float-3d">
      <div class="w-full h-full rounded-[14px] bg-white flex items-center justify-center p-2 overflow-hidden text-gray-900">
        <i data-lucide="aperture" class="w-6 h-6"></i>
      </div>
    </div>

    <!-- Status Pill -->
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 border border-blue-100 text-[#1a73e8] text-[10px] font-bold uppercase tracking-widest">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      Face Index Studio
    </div>

    <!-- Greeting Headings -->
    <div class="space-y-2 pt-1">
      <h1 class="font-cinematic text-lg sm:text-2xl text-gray-900 tracking-[0.1em] uppercase">
        WELCOME BACK
      </h1>
      <p class="text-xs text-[#1a73e8] font-semibold tracking-wider uppercase" id="welcomeUserGreeting">
        To Workspace
      </p>
    </div>

    <!-- Animated Progress Bar & Subtext -->
    <div class="flex flex-col items-center gap-2 pt-2">
      <div class="sweep-bar-light"></div>
      <span class="text-[11px] text-gray-500 font-medium tracking-wide pt-1">Initializing your workspace...</span>
    </div>

  </div>

  <script src="bg-scroll.js"></script>

  <!-- ================= TRANSITION LOGIC ================= -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();

      // Read authenticated photographer's name from storage if available
      try {
        const storedUser = localStorage.getItem('user') || localStorage.getItem('auth_user');
        if (storedUser) {
          const user = JSON.parse(storedUser);
          if (user && user.name) {
            document.getElementById('welcomeUserGreeting').innerText = `To Workspace, ${user.name}`;
          }
        }
      } catch (err) {
        console.warn('Could not read user name', err);
      }

      // Smooth transition to workspace dashboard
      setTimeout(() => {
        window.location.replace('/workspace.html');
      }, 2700);
    });
  </script>
</body>
</html>
