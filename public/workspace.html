<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WORKSPACE.AI — Studio Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="editorial.css">
  <link rel="stylesheet" href="bg-scroll.css">
  <link rel="stylesheet" href="sidebar-dark.css">
</head>
<body class="editorial min-h-screen">

  <!-- SCROLLING PHOTO-WALL BACKGROUND -->
  <div id="bgScrollRoot"></div>

  <div class="dashboard-shell">

    <!-- ================= DARK PERSISTENT SIDEBAR ================= -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo-mark">
          <i data-lucide="aperture" class="w-4 h-4"></i>
        </div>
        <span class="sidebar-brand-text">Workspace</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/workspace.html" class="sidebar-link active">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
          <span class="sidebar-label">Dashboard</span>
        </a>
        <a href="/events.html" class="sidebar-link">
          <i data-lucide="folders" class="w-4 h-4"></i>
          <span class="sidebar-label">Manage Events</span>
        </a>
        <button type="button" onclick="openSettingsModal()" class="sidebar-link">
          <i data-lucide="settings" class="w-4 h-4"></i>
          <span class="sidebar-label">Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button type="button" onclick="openSettingsModal()" class="sidebar-account-btn">
          <div class="sidebar-avatar" id="sidebarAvatar">P</div>
          <div class="sidebar-account-info sidebar-label">
            <p id="sidebarUserName">Photographer</p>
            <p id="sidebarUserEmail">—</p>
          </div>
        </button>
        <button type="button" onclick="handleLogout()" class="sidebar-logout-btn">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span class="sidebar-label">Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="dashboard-content">

      <!-- ================= HERO HEADLINE ================= -->
      <section class="editorial-hero" style="text-align:left; padding-left:40px;">
        <h1 class="headline-thin" id="workspaceHeadline" style="font-size:clamp(3rem,7vw,5.4rem);">STUDIO WORK</h1>
        <span class="tag-bracket" id="workspaceSubtitle">[ your event collections ]</span>
      </section>

      <!-- ================= EVENTS GRID ================= -->
      <main class="max-w-[1400px] mx-auto px-10 pb-24">
        <div class="mb-6 flex items-center justify-between gap-3">
          <div class="relative max-w-sm w-full">
            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="text" id="searchInput" placeholder="Search collections..." oninput="handleSearch(event)"
              class="w-full pl-10 pr-4 py-2.5 rounded-full input-3d outline-none text-xs text-gray-900 placeholder-gray-400 font-medium">
          </div>
          <button type="button" onclick="openCreateModal()" class="btn-editorial px-5 py-2.5 inline-flex items-center gap-1.5 shrink-0">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>New Event</span>
          </button>
        </div>

        <div id="eventsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center editorial-card max-w-sm mx-auto">
          <div class="w-12 h-12 rounded-full bg-gray-50 border border-gray-200 text-gray-700 flex items-center justify-center mb-3">
            <i data-lucide="camera" class="w-6 h-6"></i>
          </div>
          <h3 class="editorial-title text-sm">No Events Found</h3>
          <p class="text-xs text-gray-500 mt-1.5 mb-5 font-medium leading-relaxed">
            Create your first collection to upload and index guest photos.
          </p>
          <button onclick="openCreateModal()" class="btn-editorial px-5 py-2.5 inline-flex items-center gap-1.5">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Create Event</span>
          </button>
        </div>
      </main>
    </div>
  </div>

  <!-- ================= SETTINGS MODAL ================= -->
  <div id="settingsModal" class="fixed inset-0 z-50 bg-gray-900/40 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="modal-3d max-w-sm sm:max-w-md w-full rounded-[10px] p-5 sm:p-7 space-y-5">
      <div class="flex items-center justify-between pb-2 border-b border-gray-100">
        <h3 class="editorial-title text-sm">Account Settings</h3>
        <button type="button" onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-800 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex flex-col items-center gap-3">
        <div class="relative w-24 h-24 rounded-full overflow-hidden bg-gray-100 border border-gray-200 flex items-center justify-center text-2xl font-black text-gray-500" id="settingsAvatarPreview">
          P
        </div>
        <label class="btn-editorial-outline px-4 py-2 cursor-pointer inline-flex items-center gap-1.5">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i>
          <span id="avatarUploadLabel">Upload Photo</span>
          <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="handleAvatarChosen(event)">
        </label>
        <p class="text-[11px] text-gray-400">JPEG, PNG or WEBP — max 8MB</p>
      </div>

      <div class="border-t border-gray-100 pt-4 space-y-2">
        <div class="flex items-center justify-between text-xs">
          <span class="text-gray-500 font-medium">Name</span>
          <span class="font-bold text-gray-900" id="settingsUserName">—</span>
        </div>
        <div class="flex items-center justify-between text-xs">
          <span class="text-gray-500 font-medium">Email</span>
          <span class="font-bold text-gray-900" id="settingsUserEmail">—</span>
        </div>
      </div>

      <button type="button" onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-full bg-red-50 text-red-600 border border-red-200 text-xs font-bold uppercase tracking-wider">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </div>

  <!-- ================= CREATE EVENT MODAL ================= -->
  <div id="createModal" class="fixed inset-0 z-50 bg-gray-900/40 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="modal-3d max-w-sm sm:max-w-md w-full rounded-[10px] p-5 sm:p-7 space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-gray-100">
        <h3 class="editorial-title text-sm">New Event</h3>
        <button type="button" onclick="closeCreateModal()" class="text-gray-400 hover:text-gray-800 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="createEventForm" onsubmit="handleCreateEvent(event)" class="space-y-4">
        <div>
          <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-1">Collection Name</label>
          <input
            type="text"
            id="newEventName"
            required
            placeholder="e.g. Odyssey 2026"
            class="w-full px-4 py-2.5 rounded-xl input-3d text-xs text-gray-900 placeholder-gray-400 outline-none"
          >
        </div>

        <div class="flex items-center justify-end gap-2 pt-1">
          <button type="button" onclick="closeCreateModal()" class="px-4 py-2 rounded-full border border-gray-200 text-gray-600 text-xs font-bold">Cancel</button>
          <button type="submit" id="createSubmitBtn" class="px-5 py-2 rounded-full btn-editorial">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="bg-scroll.js"></script>

  <!-- ================= LOGIC ================= -->
  <script>
    const token = localStorage.getItem('token') || localStorage.getItem('auth_token');
    let currentUser = null;
    let allEvents = [];

    if (!token && !window.location.pathname.includes('login') && !window.location.pathname.includes('index')) {
      window.location.replace('/index.html');
    }

    function readStoredUser() {
      try {
        const raw = localStorage.getItem('user') || localStorage.getItem('auth_user');
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function renderAvatar(el, user, sizeClass) {
      if (user && user.avatar_url) {
        el.innerHTML = `<img src="${user.avatar_url}" alt="${escapeHtml(user.name || '')}">`;
      } else {
        el.textContent = ((user && user.name) || 'P')[0].toUpperCase();
      }
    }

    function applyUserToUI(user) {
      currentUser = user;
      document.getElementById('sidebarUserName').innerText = user.name || 'Photographer';
      document.getElementById('sidebarUserEmail').innerText = user.email || '';
      document.getElementById('settingsUserName').innerText = user.name || 'Photographer';
      document.getElementById('settingsUserEmail').innerText = user.email || '';
      if (user.name) document.getElementById('workspaceHeadline').innerText = `Hi, ${user.name}`;
      renderAvatar(document.getElementById('sidebarAvatar'), user);
      renderAvatar(document.getElementById('settingsAvatarPreview'), user);
    }

    const storedUser = readStoredUser();
    if (storedUser) applyUserToUI(storedUser);

    function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

    async function handleAvatarChosen(e) {
      const file = e.target.files[0];
      if (!file) return;

      const label = document.getElementById('avatarUploadLabel');
      const prevLabel = label.innerText;
      label.innerText = 'Uploading...';

      const form = new FormData();
      form.append('avatar', file);

      try {
        const res = await fetch('/api/auth/avatar', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: form
        });
        const data = await res.json();
        if (res.ok && data.success) {
          const updatedUser = { ...currentUser, avatar_url: data.avatar_url };
          localStorage.setItem('user', JSON.stringify(updatedUser));
          localStorage.setItem('auth_user', JSON.stringify(updatedUser));
          applyUserToUI(updatedUser);
          if (typeof lucide !== 'undefined') lucide.createIcons();
        } else {
          alert(data.message || 'Could not update your photo.');
        }
      } catch (err) {
        alert('Network error while uploading photo.');
      } finally {
        label.innerText = prevLabel;
        e.target.value = '';
      }
    }

    async function loadUserGalleries() {
      try {
        const res = await fetch('/api/galleries', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.status === 401 || res.status === 403) return handleLogout();
        allEvents = await res.json();
        document.getElementById('workspaceSubtitle').innerText = `[ ${allEvents.length} collection${allEvents.length === 1 ? '' : 's'} ]`;
        renderGalleries(allEvents);
      } catch (err) {}
    }

    function handleSearch(e) {
      const q = e.target.value.toLowerCase().trim();
      renderGalleries(!q ? allEvents : allEvents.filter(ev => (ev.name || ev.event_name || '').toLowerCase().includes(q)));
    }

    function goToEvent(id, slug) {
      window.location.href = `event-detail.html?id=${id || slug}`;
    }

    function renderGalleries(events) {
      const grid = document.getElementById('eventsGrid');
      const emptyState = document.getElementById('emptyState');
      if (!events || events.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      grid.innerHTML = events.map(ev => {
        const title = ev.event_name || ev.name || 'Untitled Event';
        const id = ev.id || ev._id || '';
        const slug = ev.slug || id;
        const count = ev.photo_count || 0;
        return `
          <div class="editorial-card flex flex-col justify-between cursor-pointer group" onclick="goToEvent('${id}', '${slug}')">
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="editorial-label inline-flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full ${count > 0 ? 'bg-emerald-500' : 'bg-amber-400'}"></span>
                  ${count > 0 ? 'Indexed' : 'Pending'}
                </span>
                <button type="button" onclick="event.stopPropagation(); deleteEvent('${id}', '${escapeHtml(title)}')" class="p-1.5 text-gray-400 hover:text-red-500">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
              <h3 class="editorial-title group-hover:opacity-70 transition truncate">${escapeHtml(title)}</h3>
              <p class="text-[11px] text-gray-500 mt-1">${count} indexed photos</p>
            </div>
            <div class="flex items-center justify-between mt-5 pt-3 border-t border-gray-100">
              <i data-lucide="images" class="w-4 h-4 text-gray-400"></i>
              <i data-lucide="arrow-up-right" class="w-4 h-4 text-gray-400 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
            </div>
          </div>
        `;
      }).join('');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
    function closeCreateModal() { document.getElementById('createModal').classList.add('hidden'); }

    async function handleCreateEvent(e) {
      e.preventDefault();
      const btn = document.getElementById('createSubmitBtn');
      const name = document.getElementById('newEventName').value.trim();
      btn.disabled = true;
      try {
        const res = await fetch('/api/galleries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (res.ok) {
          closeCreateModal();
          window.location.href = `events.html?id=${data.id || (data.gallery && data.gallery.id)}&autoUpload=true`;
        } else {
          alert(data.message || 'Error creating event');
        }
      } catch (err) {
        alert('Server unreachable');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteEvent(id, name) {
      if (!confirm(`Delete "${name}"?`)) return;
      try {
        await fetch(`/api/galleries/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        loadUserGalleries();
      } catch (e) {}
    }

    function handleLogout() {
      localStorage.clear();
      window.location.replace('/index.html');
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.innerText = t;
      return d.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      // Refresh from server too, so a photo uploaded on another device shows up
      try {
        const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.user) {
            localStorage.setItem('user', JSON.stringify(data.user));
            localStorage.setItem('auth_user', JSON.stringify(data.user));
            applyUserToUI(data.user);
            if (typeof lucide !== 'undefined') lucide.createIcons();
          }
        }
      } catch (e) {}
      loadUserGalleries();
    });
  </script>
</body>
</html>
