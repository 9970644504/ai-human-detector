<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Work Space — Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="editorial.css">
  <link rel="stylesheet" href="bg-scroll.css">
</head>
<body class="editorial min-h-screen">

  <!-- SCROLLING PHOTO-WALL BACKGROUND -->
  <div id="bgScrollRoot"></div>

  <!-- ================= TOP NAV ================= -->
  <header class="nav-editorial">
    <div class="nav-editorial-inner">
      <div class="nav-logo"><div class="nav-logo-mark"><i data-lucide="aperture" class="w-3.5 h-3.5"></i></div><span class="nav-logo-text" id="navBrand">WORK SPACE</span></div>

      <nav class="nav-links hidden sm:flex">
        <button type="button" class="nav-link-btn active" onclick="resetGalleryView()">All Photos</button>
        <button type="button" class="nav-link-btn" onclick="openFaceSearchModal()">Find My Face</button>
        <button type="button" class="nav-link-btn" id="navDownloadAllBtn" onclick="downloadEventZip(false)">Download</button>
      </nav>

      <div class="nav-actions">
        <button type="button" onclick="openFaceSearchModal()" class="btn-editorial px-4 py-2 hidden sm:inline-flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>Find My Face</span>
        </button>
        <button type="button" onclick="downloadEventZip(false)" id="mobileNavZipBtn" class="p-2 rounded-full border border-gray-200 sm:hidden">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= HERO HEADLINE ================= -->
  <section class="editorial-hero">
    <h1 class="headline-thin" id="galleryHeadline">EVENT PHOTOS</h1>
    <span class="tag-bracket" id="gallerySubtitle">[ Connecting to photos... ]</span>
  </section>

  <!-- Active Search Filter Ribbon -->
  <div id="filterRibbon" class="hidden max-w-[1400px] mx-auto px-6 pb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
    <div>
      <p class="text-sm font-bold text-gray-900" id="filterText">Matched photos for your face</p>
      <p class="text-xs text-gray-500 font-medium" id="filterCount">0 photo(s) found</p>
    </div>
    <div class="flex flex-wrap items-center gap-2.5">
      <button onclick="downloadEventZip(true)" class="btn-editorial px-5 py-2.5 inline-flex items-center gap-2">
        <i data-lucide="archive" class="w-3.5 h-3.5"></i>
        <span>Download Matches</span>
      </button>
      <button id="btnDownloadAllFiles" onclick="downloadMatchedAsIndividualFiles()" class="btn-editorial-outline px-5 py-2.5 inline-flex items-center gap-2">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span>Save Each Image</span>
      </button>
      <button onclick="resetGalleryView()" class="px-4 py-2.5 rounded-full border border-gray-300 bg-white hover:bg-gray-50 text-xs font-semibold text-gray-700 transition">
        View All Photos
      </button>
    </div>
  </div>

  <!-- ================= PHOTO GRID ================= -->
  <main id="photosContainer">
    <div class="photo-grid-editorial">
      <div class="photo-tile animate-pulse"></div>
      <div class="photo-tile animate-pulse"></div>
      <div class="photo-tile animate-pulse"></div>
      <div class="photo-tile animate-pulse"></div>
      <div class="photo-tile animate-pulse"></div>
    </div>
  </main>

  <!-- ================= MODAL / BOTTOM SHEET: FACE SEARCH ================= -->
  <div id="faceSearchModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-[28px] sm:rounded-[10px] p-5 sm:p-8 relative space-y-4 sm:space-y-6 shadow-2xl max-h-[90vh] overflow-y-auto border border-gray-100">

      <!-- Modal Header -->
      <div class="flex items-start justify-between pb-3 border-b border-gray-100">
        <div class="space-y-1">
          <div class="editorial-label">Face Vision</div>
          <h3 class="editorial-title text-lg">Find Yourself in Archive</h3>
        </div>
        <button onclick="closeFaceSearchModal()" class="text-gray-400 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100 transition cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Segmented Mode Tabs -->
      <div class="flex rounded-full bg-gray-100 p-1">
        <button id="tabUploadBtn" onclick="switchMode('upload')" class="flex-1 py-2 text-xs font-bold rounded-full bg-white shadow-xs text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i>
          <span>Upload File</span>
        </button>
        <button id="tabCameraBtn" onclick="switchMode('camera')" class="flex-1 py-2 text-xs font-bold rounded-full text-gray-500 hover:text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer">
          <i data-lucide="camera" class="w-3.5 h-3.5"></i>
          <span>Live Camera</span>
        </button>
      </div>

      <!-- View 1: Upload File -->
      <div id="uploadAreaView" class="space-y-3">
        <label for="selfieInput" class="group relative flex flex-col items-center justify-center border-2 border-dashed border-gray-300 hover:border-gray-900 rounded-2xl p-6 sm:p-8 cursor-pointer bg-gray-50/60 transition text-center space-y-2">
          <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white text-gray-900 flex items-center justify-center shadow-xs overflow-hidden border border-gray-200 group-hover:scale-105 transition-transform">
            <i data-lucide="image" id="defaultUploadIcon" class="w-6 h-6 sm:w-7 sm:h-7"></i>
            <img id="selfiePreviewImg" class="w-full h-full object-cover hidden" alt="Selfie Preview" />
          </div>

          <div>
            <span id="selfieStatusText" class="text-xs sm:text-sm font-bold text-gray-800 block">Click to select portrait photo</span>
            <span class="text-[10px] sm:text-xs text-gray-500 font-medium" id="selfieSubText">JPEG, PNG or WEBP (Instant AI Matching)</span>
          </div>
          <input type="file" id="selfieInput" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="handleSelfieChosen(event)">
        </label>
      </div>

      <!-- View 2: Live Camera -->
      <div id="cameraAreaView" class="hidden space-y-3">
        <div class="relative aspect-square sm:aspect-4/3 rounded-2xl overflow-hidden bg-black shadow-inner flex items-center justify-center">
          <video id="webcamVideo" autoplay playsinline class="w-full h-full object-cover"></video>
          <canvas id="cameraCanvas" class="hidden"></canvas>
          <div class="absolute inset-6 sm:inset-8 border-2 border-dashed border-white/60 rounded-full pointer-events-none flex items-center justify-center">
            <span class="text-[10px] sm:text-xs text-white bg-black/60 px-3.5 py-1 rounded-full font-medium">Position Face Here</span>
          </div>
        </div>

        <button type="button" onclick="captureCameraShot()" class="w-full py-3 rounded-full bg-gray-900 hover:bg-black text-white text-xs font-bold flex items-center justify-center gap-2 transition cursor-pointer shadow-sm active:scale-98">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>Take Snapshot</span>
        </button>
      </div>

      <!-- Progress Bar -->
      <div id="scanProgressContainer" class="hidden space-y-2.5 p-3 sm:p-4 rounded-xl bg-gray-50 border border-gray-200">
        <div class="flex items-center justify-between text-xs font-medium">
          <span class="text-gray-700 flex items-center gap-2">
            <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i>
            <span>Computing 512D ArcFace Vector...</span>
          </span>
          <span class="text-gray-900 font-bold">Matching</span>
        </div>
        <div class="w-full h-1 bg-gray-200 rounded-full overflow-hidden">
          <div class="h-full w-1/2 bg-gray-900 animate-pulse"></div>
        </div>
        <p class="text-[10px] sm:text-[11px] text-gray-500 font-medium truncate">Comparing facial embeddings in RAM...</p>
      </div>

      <!-- Action Button -->
      <button
        id="matchFaceBtn"
        type="button"
        onclick="executeFaceSearch()"
        disabled
        class="w-full py-3.5 rounded-full btn-editorial flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span id="matchFaceBtnText">Scan & Find Photos</span>
      </button>

    </div>
  </div>

  <!-- LIGHTBOX PREVIEW -->
  <div id="imageLightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex flex-col items-center justify-center p-3 sm:p-6">
    <div class="absolute top-4 sm:top-5 right-4 sm:right-5 flex items-center gap-2 sm:gap-3 z-50">
      <button id="lightboxDownloadBtn" onclick="downloadSingleImage(activeLightboxUrl, activeLightboxFilename)" class="inline-flex items-center gap-1.5 sm:gap-2 px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white text-xs font-bold backdrop-blur-md transition cursor-pointer border border-white/15 active:scale-95">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span>Download</span>
      </button>
      <button onclick="closeLightbox()" class="p-2 sm:p-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white transition cursor-pointer border border-white/15 active:scale-95">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <img id="lightboxImg" src="" alt="Full Preview" class="max-h-[82vh] max-w-[95vw] lg:max-w-[85vw] object-contain rounded-2xl shadow-2xl">
  </div>

  <script>
    /* ================= GALLERY APPLICATION LOGIC ================= */
    let activeEvent = null;
    let allPhotos = [];
    let matchedPhotos = [];
    let selectedSelfieFile = null;
    let cameraStream = null;
    let activeLightboxUrl = '';
    let activeLightboxFilename = '';

    document.addEventListener('DOMContentLoaded', () => {
      loadPublicGallery();
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });

    function getEventIdentifier() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('slug') || urlParams.get('id') || window.location.pathname.split('/').pop();
    }

    async function loadPublicGallery() {
      const identifier = getEventIdentifier();
      if (!identifier || identifier === 'gallery.html') {
        renderErrorState('No event link provided. Please check the URL.');
        return;
      }

      try {
        const res = await fetch(`/api/galleries/${encodeURIComponent(identifier)}`);
        if (!res.ok) {
          renderErrorState('Gallery Unavailable. This event may have expired or been deleted.');
          return;
        }

        const data = await res.json();
        activeEvent = data.event || data.gallery || data;
        allPhotos = data.photos || activeEvent.photos || [];

        const title = activeEvent.name || activeEvent.event_name || 'Event Photos';
        document.getElementById('navBrand').innerText = title.toUpperCase();
        document.getElementById('galleryHeadline').innerText = title;
        document.getElementById('gallerySubtitle').innerText = `[ ${allPhotos.length} photo${allPhotos.length === 1 ? '' : 's'} ]`;

        renderPhotos(allPhotos);
      } catch (err) {
        console.error('Gallery Fetch Exception:', err);
        renderErrorState('Could not reach the gallery server.');
      }
    }

    function renderPhotos(photos, customHeading = null) {
      const container = document.getElementById('photosContainer');
      container.innerHTML = '';

      if (!photos || photos.length === 0) {
        container.innerHTML = `
          <div class="editorial-card text-center py-16 sm:py-20 px-4 sm:px-6 max-w-md mx-auto space-y-3">
            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gray-50 text-gray-800 flex items-center justify-center mx-auto border border-gray-200">
              <i data-lucide="camera-off" class="w-6 h-6"></i>
            </div>
            <h3 class="editorial-title text-base">No Photos Found</h3>
            <p class="text-xs text-gray-500 font-medium">No matching photos found in this view.</p>
          </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
        return;
      }

      const groups = {};
      photos.forEach(p => {
        const folder = customHeading || p.folder_name || 'All Photos';
        if (!groups[folder]) groups[folder] = [];
        groups[folder].push(p);
      });

      Object.keys(groups).forEach(folderName => {
        const list = groups[folderName];
        const wrap = document.createElement('section');
        wrap.className = 'mb-2';

        const heading = Object.keys(groups).length > 1 || customHeading ? `
          <div class="max-w-[1400px] mx-auto px-6 pt-6 pb-3 flex items-center justify-between">
            <h2 class="editorial-title text-sm">${escapeHtml(folderName)}</h2>
            <span class="editorial-label">${list.length} photo(s)</span>
          </div>
        ` : '';

        wrap.innerHTML = `
          ${heading}
          <div class="photo-grid-editorial">
            ${list.map((photo) => {
              const src = photo.url || photo.file_path || (typeof photo === 'string' ? photo : '');
              const filename = photo.filename || src.split('/').pop() || 'photo.jpg';
              return `
                <div class="photo-tile" onclick="openLightbox('${src}', '${filename}')">
                  <img src="${src}" alt="Event Photo" loading="lazy">
                  <div class="photo-tile-overlay">
                    <button onclick="event.stopPropagation(); downloadSingleImage('${src}', '${filename}')" title="Download Photo" class="w-8 h-8 rounded-full bg-white/90 hover:bg-white text-gray-900 flex items-center justify-center shadow cursor-pointer">
                      <i data-lucide="download" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

        container.appendChild(wrap);
      });

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function downloadSingleImage(url, filename) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename || 'event_photo.jpg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename || 'photo.jpg';
        a.target = '_blank';
        a.click();
      }
    }

    async function downloadEventZip(isMatchedOnly = false) {
      const identifier = (activeEvent && (activeEvent.id || activeEvent.slug)) || getEventIdentifier();
      if (!identifier) return;

      const targetList = isMatchedOnly ? matchedPhotos : allPhotos;
      if (!targetList || targetList.length === 0) {
        alert("No photos available to download in this view.");
        return;
      }

      const desktopBtn = document.getElementById('navDownloadAllBtn');
      const mobileBtn = document.getElementById('mobileNavZipBtn');

      const setBtnLoading = (btn) => {
        if (!btn) return '';
        const prev = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i>`;
        return prev;
      };

      const restoreBtn = (btn, prevHtml) => {
        if (!btn || !prevHtml) return;
        btn.disabled = false;
        btn.innerHTML = prevHtml;
      };

      const prevDesk = setBtnLoading(desktopBtn);
      const prevMob = setBtnLoading(mobileBtn);
      if (typeof lucide !== 'undefined') lucide.createIcons();

      const photoIds = isMatchedOnly ? targetList.map(p => p.id) : null;

      try {
        const res = await fetch(`/api/galleries/${encodeURIComponent(identifier)}/download-zip`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ photoIds })
        });

        const contentType = res.headers.get('content-type') || '';
        if (!res.ok || contentType.includes('application/json')) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || 'ZIP download failed');
        }

        const blob = await res.blob();
        const safeTitle = (activeEvent.name || 'Photos').replace(/[^a-zA-Z0-9_-]/g, '_');
        const filename = `${safeTitle}_${isMatchedOnly ? 'Matched' : 'All'}.zip`;

        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(blobUrl);
        }, 500);

      } catch (err) {
        alert('Could not download ZIP: ' + err.message);
      } finally {
        restoreBtn(desktopBtn, prevDesk);
        restoreBtn(mobileBtn, prevMob);
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }
    }

    async function downloadMatchedAsIndividualFiles() {
      if (!matchedPhotos || matchedPhotos.length === 0) return;

      const btn = document.getElementById('btnDownloadAllFiles');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;

      for (let i = 0; i < matchedPhotos.length; i++) {
        const photo = matchedPhotos[i];
        const src = photo.url || photo.file_path;
        const filename = photo.filename || `matched_${i + 1}.jpg`;

        btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> <span>Saving ${i + 1}/${matchedPhotos.length}...</span>`;
        if (typeof lucide !== 'undefined') lucide.createIcons();

        await downloadSingleImage(src, filename);
        await new Promise(r => setTimeout(r, 250));
      }

      btn.disabled = false;
      btn.innerHTML = originalHtml;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function renderErrorState(message) {
      document.getElementById('gallerySubtitle').innerText = '[ Connection error ]';
      document.getElementById('photosContainer').innerHTML = `
        <div class="editorial-card text-center py-16 sm:py-20 px-4 sm:px-6 max-w-md mx-auto space-y-3">
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center mx-auto border border-red-100">
            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
          </div>
          <h3 class="editorial-title text-base">Gallery Unavailable</h3>
          <p class="text-xs text-red-500 font-semibold">${escapeHtml(message)}</p>
        </div>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function openFaceSearchModal() {
      document.getElementById('faceSearchModal').classList.remove('hidden');
      switchMode('upload');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function closeFaceSearchModal() {
      stopCamera();
      document.getElementById('faceSearchModal').classList.add('hidden');
      selectedSelfieFile = null;
      document.getElementById('selfieInput').value = '';
      document.getElementById('selfieStatusText').innerText = 'Click to select portrait photo';
      document.getElementById('selfieSubText').innerText = 'JPEG, PNG or WEBP (Instant AI Matching)';
      document.getElementById('selfiePreviewImg').classList.add('hidden');
      document.getElementById('selfiePreviewImg').src = '';
      document.getElementById('defaultUploadIcon').classList.remove('hidden');
      document.getElementById('matchFaceBtn').disabled = true;
      document.getElementById('scanProgressContainer').classList.add('hidden');
    }

    function switchMode(mode) {
      const uploadTab = document.getElementById('tabUploadBtn');
      const cameraTab = document.getElementById('tabCameraBtn');
      const uploadArea = document.getElementById('uploadAreaView');
      const cameraArea = document.getElementById('cameraAreaView');

      if (mode === 'upload') {
        stopCamera();
        uploadTab.className = 'flex-1 py-2 text-xs font-bold rounded-full bg-white shadow-xs text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer';
        cameraTab.className = 'flex-1 py-2 text-xs font-bold rounded-full text-gray-500 hover:text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer';
        uploadArea.classList.remove('hidden');
        cameraArea.classList.add('hidden');
      } else {
        uploadTab.className = 'flex-1 py-2 text-xs font-bold rounded-full text-gray-500 hover:text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer';
        cameraTab.className = 'flex-1 py-2 text-xs font-bold rounded-full bg-white shadow-xs text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer';
        uploadArea.classList.add('hidden');
        cameraArea.classList.remove('hidden');
        startCamera();
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function startCamera() {
      const video = document.getElementById('webcamVideo');
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = cameraStream;
      } catch (err) {
        alert('Could not access webcam. Please verify browser camera permissions.');
        switchMode('upload');
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    function captureCameraShot() {
      const video = document.getElementById('webcamVideo');
      const canvas = document.createElement('canvas');
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        selectedSelfieFile = new File([blob], `selfie_${Date.now()}.jpg`, { type: 'image/jpeg' });

        const previewImg = document.getElementById('selfiePreviewImg');
        previewImg.src = URL.createObjectURL(blob);
        previewImg.classList.remove('hidden');
        document.getElementById('defaultUploadIcon').classList.add('hidden');
        document.getElementById('selfieStatusText').innerText = 'Camera Snapshot Ready';
        document.getElementById('selfieSubText').innerText = `${(blob.size / (1024 * 1024)).toFixed(2)} MB — Captured`;

        switchMode('upload');
        document.getElementById('matchFaceBtn').disabled = false;
      }, 'image/jpeg', 0.90);
    }

    function handleSelfieChosen(e) {
      const file = e.target.files[0];
      if (file) {
        selectedSelfieFile = file;
        document.getElementById('selfieStatusText').innerText = file.name;
        document.getElementById('selfieSubText').innerText = `${(file.size / (1024 * 1024)).toFixed(2)} MB — Ready`;

        const reader = new FileReader();
        reader.onload = function(evt) {
          const previewImg = document.getElementById('selfiePreviewImg');
          previewImg.src = evt.target.result;
          previewImg.classList.remove('hidden');
          document.getElementById('defaultUploadIcon').classList.add('hidden');
        };
        reader.readAsDataURL(file);

        document.getElementById('matchFaceBtn').disabled = false;
      }
    }

    function compressSelfieForUpload(file, maxDimension = 380) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDimension) {
            h = Math.round((h * maxDimension) / w);
            w = maxDimension;
          } else if (h > maxDimension) {
            w = Math.round((w * maxDimension) / h);
            h = maxDimension;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            resolve(new File([blob], 'selfie.jpg', { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.85);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    async function executeFaceSearch() {
      if (!selectedSelfieFile) return;

      const targetIdentifier = (activeEvent && (activeEvent.id || activeEvent.slug)) || getEventIdentifier();
      const btn = document.getElementById('matchFaceBtn');
      const progressContainer = document.getElementById('scanProgressContainer');

      btn.disabled = true;
      progressContainer.classList.remove('hidden');

      try {
        const compressedSelfie = await compressSelfieForUpload(selectedSelfieFile, 380);
        const formData = new FormData();
        formData.append('selfie', compressedSelfie);

        const res = await fetch(`/api/galleries/${encodeURIComponent(targetIdentifier)}/search-face`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (res.ok && data.success) {
          closeFaceSearchModal();
          matchedPhotos = data.matchedPhotos || [];

          if (matchedPhotos.length === 0) {
            alert('Face scan completed: No matching photos found for this person.');
            return;
          }

          document.getElementById('filterRibbon').classList.remove('hidden');
          document.getElementById('filterText').innerText = `Matched photos for your face`;
          document.getElementById('filterCount').innerText = `${matchedPhotos.length} photo(s) found`;

          renderPhotos(matchedPhotos, "Matched Photos");
        } else {
          alert(data.message || 'No matching face detected.');
        }
      } catch (err) {
        alert('Communication error while scanning selfie.');
      } finally {
        btn.disabled = false;
        progressContainer.classList.add('hidden');
      }
    }

    function resetGalleryView() {
      document.getElementById('filterRibbon').classList.add('hidden');
      renderPhotos(allPhotos);
    }

    function openLightbox(src, filename) {
      if (!src) return;
      activeLightboxUrl = src;
      activeLightboxFilename = filename || 'photo.jpg';
      document.getElementById('lightboxImg').src = src;
      document.getElementById('imageLightbox').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('imageLightbox').classList.add('hidden');
      activeLightboxUrl = '';
      activeLightboxFilename = '';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
  <script src="bg-scroll.js"></script>
</body>
</html>
