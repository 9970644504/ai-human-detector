<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Work Space — Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

    body {
      background-color: #f8fafd;
      font-family: 'Google Sans', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: #1f1f1f;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #googleMeshCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      filter: blur(85px);
      opacity: 0.45;
    }

    .google-nav {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid #dadce0;
      box-shadow: 0 2px 10px rgba(60, 64, 67, 0.06);
    }

    .google-bottom-dock {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid #dadce0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
    }

    .google-border-top {
      background: linear-gradient(90deg, #4285f4 0%, #ea4335 25%, #fbbc05 50%, #34a853 75%, #4285f4 100%);
      height: 3px;
      width: 100%;
    }

    .btn-google-highlight {
      background: #1a73e8;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.35);
      transition: all 0.2s ease;
    }
    .btn-google-highlight:hover {
      background: #1557b0;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.45);
      transform: translateY(-1px);
    }
    .btn-google-highlight:active {
      transform: scale(0.97);
    }

    .google-btn-ring {
      padding: 2px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #4285f4, #ea4335, #fbbc05, #34a853, #4285f4);
      background-size: 300% 300%;
      animation: ringShift 4s ease infinite;
      box-shadow: 0 4px 14px rgba(66, 133, 244, 0.25);
    }
    @keyframes ringShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .google-card {
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 20px;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.08);
      transition: box-shadow 0.2s ease;
    }
    .google-card:hover {
      box-shadow: 0 4px 14px rgba(60, 64, 67, 0.12);
    }

    @keyframes googleBarSweep {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(20%); }
      100% { transform: translateX(100%); }
    }
    .google-4bar {
      height: 4px;
      width: 100%;
      background: #f1f3f4;
      overflow: hidden;
      position: relative;
      border-radius: 9999px;
    }
    .google-4bar::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 60%;
      background: linear-gradient(90deg, #4285f4 0%, #ea4335 30%, #fbbc05 60%, #34a853 100%);
      animation: googleBarSweep 1.6s infinite ease-in-out;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen relative pb-24 sm:pb-10">

  <div class="fixed top-0 left-0 right-0 z-50 google-border-top"></div>
  <canvas id="googleMeshCanvas"></canvas>

  <!-- ================= TOP APP BAR ================= -->
  <header class="sticky top-0 z-40 google-nav mt-[3px]">

              <line x1="33" y1="17" x2="27" y2="21" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
              <line x1="37" y1="24" x2="31" y2="33" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" />

              <line x1="11" y1="24" x2="17" y2="15" stroke="#4285F4" stroke-width="3" stroke-linecap="round" />

  <!-- ================= PROCEDURAL 4-COLOR CANVAS ================= -->
  <script>
    const canvas = document.getElementById('googleMeshCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const nodes = [
      { x: width * 0.2, y: height * 0.2, vx: 0.45, vy: 0.35, r: 340, color: 'rgba(66, 133, 244, 0.45)' },
      { x: width * 0.8, y: height * 0.25, vx: -0.35, vy: 0.55, r: 350, color: 'rgba(234, 67, 53, 0.35)' },
      { x: width * 0.75, y: height * 0.75, vx: -0.55, vy: -0.35, r: 330, color: 'rgba(251, 188, 5, 0.35)' },
      { x: width * 0.25, y: height * 0.7, vx: 0.4, vy: -0.45, r: 360, color: 'rgba(52, 168, 83, 0.45)' }
    ];

    function renderGoogleMesh() {
      ctx.clearRect(0, 0, width, height);

      nodes.forEach(n => {
        n.x += n.vx;
        n.y += n.vy;

        if (n.x < width * 0.05 || n.x > width * 0.95) n.vx *= -1;
        if (n.y < height * 0.05 || n.y > height * 0.95) n.vy *= -1;

        const grad = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.r);
        grad.addColorStop(0, n.color);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(renderGoogleMesh);
    }
    renderGoogleMesh();

    /* ================= GALLERY APPLICATION LOGIC ================= */
    let activeEvent = null;
    let allPhotos = [];
    let matchedPhotos = [];
    let selectedSelfieFile = null;
    let cameraStream = null;
    let activeLightboxUrl = '';
    let activeLightboxFilename = '';

    document.addEventListener('DOMContentLoaded', () => {
      loadPublicGallery();
    });

    function getEventIdentifier() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('slug') || urlParams.get('id') || window.location.pathname.split('/').pop();
    }

    async function loadPublicGallery() {
      const identifier = getEventIdentifier();
      if (!identifier || identifier === 'gallery.html') {
        renderErrorState('No event link provided. Please check the URL.');
        return;
      }

      try {
        const res = await fetch(`/api/galleries/${encodeURIComponent(identifier)}`);
        if (!res.ok) {
          renderErrorState('Gallery Unavailable. This event may have expired or been deleted.');
          return;
        }

        const data = await res.json();
        activeEvent = data.event || data.gallery || data;
        allPhotos = data.photos || activeEvent.photos || [];

        const title = activeEvent.name || activeEvent.event_name || 'Event Photos';
        document.getElementById('gallerySubtitle').innerHTML = `
          <span class="w-2 h-2 rounded-full bg-[#34a853] inline-block animate-pulse"></span> ${escapeHtml(title)} • ${allPhotos.length} Photos
        `;

        if (allPhotos.length > 0) {
          const navBtn = document.getElementById('navDownloadAllBtn');
          if (navBtn) navBtn.classList.remove('hidden');
        }

        renderPhotos(allPhotos);
      } catch (err) {
        console.error('Gallery Fetch Exception:', err);
        renderErrorState('Could not reach the gallery server.');
      }
    }

    function renderPhotos(photos, customHeading = null) {
      const container = document.getElementById('photosContainer');
      container.innerHTML = '';

      if (!photos || photos.length === 0) {
        container.innerHTML = `
          <div class="google-card text-center py-16 sm:py-20 px-4 sm:px-6 max-w-md mx-auto space-y-3">
            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-blue-50 text-[#1a73e8] flex items-center justify-center mx-auto border border-blue-100">
              <i data-lucide="camera-off" class="w-6 h-6"></i>
            </div>
            <h3 class="text-sm sm:text-base font-bold text-gray-900">No Photos Found</h3>
            <p class="text-xs text-gray-500 font-medium">No matching photos found in this view.</p>
          </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
        return;
      }

      const groups = {};
      photos.forEach(p => {
        const folder = customHeading || p.folder_name || 'All Photos';
        if (!groups[folder]) groups[folder] = [];
        groups[folder].push(p);
      });

      Object.keys(groups).forEach(folderName => {
        const list = groups[folderName];
        const section = document.createElement('section');
        section.className = 'google-card p-4 sm:p-6 lg:p-8 space-y-4 sm:space-y-5';

        const headerIcon = customHeading ? `
          <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl p-[1.5px] bg-gradient-to-tr from-[#4285F4] via-[#EA4335] to-[#34A853] shadow-xs shrink-0">
            <div class="w-full h-full rounded-[10px] bg-white flex items-center justify-center p-1">
              <svg class="w-full h-full" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="16" stroke="#c2d7fc" stroke-width="2.5" stroke-dasharray="2 2" />
                <line x1="24" y1="11" x2="33" y2="17" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
                <line x1="33" y1="17" x2="27" y2="21" stroke="#EA4335" stroke-width="3" stroke-linecap="round" />
                <line x1="37" y1="24" x2="31" y2="33" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" />
                <line x1="31" y1="33" x2="27" y2="27" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" />
                <line x1="24" y1="37" x2="15" y2="31" stroke="#34A853" stroke-width="3" stroke-linecap="round" />
                <line x1="15" y1="31" x2="21" y2="27" stroke="#34A853" stroke-width="3" stroke-linecap="round" />
                <line x1="11" y1="24" x2="17" y2="15" stroke="#4285F4" stroke-width="3" stroke-linecap="round" />
                <line x1="17" y1="15" x2="21" y2="21" stroke="#4285F4" stroke-width="3" stroke-linecap="round" />
                <circle cx="24" cy="24" r="4.5" fill="#4285F4" />
                <circle cx="24" cy="24" r="2" fill="#ffffff" opacity="0.8" />
              </svg>
            </div>
          </div>
        ` : `
          <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-blue-50 text-[#1a73e8] border border-blue-100 flex items-center justify-center shadow-xs shrink-0">
            <i data-lucide="folder" class="w-4 h-4"></i>
          </div>
        `;

        section.innerHTML = `
          <div class="flex items-center justify-between border-b border-gray-100 pb-3">
            <div class="flex items-center gap-3">
              ${headerIcon}
              <div>
                <h3 class="text-xs sm:text-base font-bold text-gray-900">${escapeHtml(folderName)}</h3>
                <p class="text-[10px] sm:text-xs font-semibold text-gray-400">${list.length} photo(s)</p>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2.5 sm:gap-3.5 lg:gap-4 pt-1">
            ${list.map((photo) => {
              const src = photo.url || photo.file_path || (typeof photo === 'string' ? photo : '');
              const filename = photo.filename || src.split('/').pop() || 'photo.jpg';
              return `
                <div class="group relative aspect-square rounded-xl sm:rounded-2xl overflow-hidden bg-gray-100 border ${customHeading ? 'border-[#4285f4] shadow-md shadow-blue-500/15' : 'border-gray-200'} transition-all duration-200 hover:scale-[1.02] hover:shadow-lg">
                  <img 
                    src="${src}" 
                    alt="Event Photo" 
                    loading="lazy" 
                    onclick="openLightbox('${src}', '${filename}')"
                    class="w-full h-full object-cover cursor-pointer transition-transform duration-500 group-hover:scale-105"
                  >

                  <button 
                    onclick="event.stopPropagation(); downloadSingleImage('${src}', '${filename}')"
                    title="Download Photo"
                    class="absolute top-2 right-2 w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white/90 hover:bg-white text-gray-800 flex items-center justify-center opacity-90 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity shadow-md cursor-pointer border border-gray-200 hover:scale-105"
                  >
                    <i data-lucide="download" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-[#1a73e8]"></i>
                  </button>

                  <div onclick="openLightbox('${src}', '${filename}')" class="hidden sm:flex absolute bottom-2.5 left-2.5 p-1.5 rounded-full bg-white/80 text-gray-800 opacity-0 group-hover:opacity-100 transition-opacity shadow-xs cursor-pointer">
                    <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

        container.appendChild(section);
      });

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function downloadSingleImage(url, filename) {
      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename || 'event_photo.jpg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename || 'photo.jpg';
        a.target = '_blank';
        a.click();
      }
    }

    async function downloadEventZip(isMatchedOnly = false) {
      const identifier = (activeEvent && (activeEvent.id || activeEvent.slug)) || getEventIdentifier();
      if (!identifier) return;

      const targetList = isMatchedOnly ? matchedPhotos : allPhotos;
      if (!targetList || targetList.length === 0) {
        alert("No photos available to download in this view.");
        return;
      }

      const desktopBtn = document.getElementById('navDownloadAllBtn');
      const mobileBtn = document.getElementById('mobileNavZipBtn');
      
      const setBtnLoading = (btn) => {
        if (!btn) return '';
        const prev = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> <span>Creating ZIP...</span>`;
        return prev;
      };

      const restoreBtn = (btn, prevHtml) => {
        if (!btn || !prevHtml) return;
        btn.disabled = false;
        btn.innerHTML = prevHtml;
      };

      const prevDesk = setBtnLoading(desktopBtn);
      const prevMob = setBtnLoading(mobileBtn);
      if (typeof lucide !== 'undefined') lucide.createIcons();

      const photoIds = isMatchedOnly ? targetList.map(p => p.id) : null;

      try {
        const res = await fetch(`/api/galleries/${encodeURIComponent(identifier)}/download-zip`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ photoIds })
        });

        const contentType = res.headers.get('content-type') || '';
        if (!res.ok || contentType.includes('application/json')) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || 'ZIP download failed');
        }

        const blob = await res.blob();
        const safeTitle = (activeEvent.name || 'Photos').replace(/[^a-zA-Z0-9_-]/g, '_');
        const filename = `${safeTitle}_${isMatchedOnly ? 'Matched' : 'All'}.zip`;

        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(blobUrl);
        }, 500);

      } catch (err) {
        alert('Could not download ZIP: ' + err.message);
      } finally {
        restoreBtn(desktopBtn, prevDesk);
        restoreBtn(mobileBtn, prevMob);
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }
    }

    async function downloadMatchedAsIndividualFiles() {
      if (!matchedPhotos || matchedPhotos.length === 0) return;

      const btn = document.getElementById('btnDownloadAllFiles');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;

      for (let i = 0; i < matchedPhotos.length; i++) {
        const photo = matchedPhotos[i];
        const src = photo.url || photo.file_path;
        const filename = photo.filename || `matched_${i + 1}.jpg`;

        btn.innerHTML = `<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> <span>Saving ${i + 1}/${matchedPhotos.length}...</span>`;
        if (typeof lucide !== 'undefined') lucide.createIcons();

        await downloadSingleImage(src, filename);
        await new Promise(r => setTimeout(r, 250));
      }

      btn.disabled = false;
      btn.innerHTML = originalHtml;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function renderErrorState(message) {
      document.getElementById('gallerySubtitle').innerText = 'Connection error';
      document.getElementById('photosContainer').innerHTML = `
        <div class="google-card text-center py-16 sm:py-20 px-4 sm:px-6 max-w-md mx-auto space-y-3">
          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-red-50 text-[#ea4335] flex items-center justify-center mx-auto border border-red-100">
            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
          </div>
          <h3 class="text-sm sm:text-base font-bold text-gray-900">Gallery Unavailable</h3>
          <p class="text-xs text-[#ea4335] font-semibold">${escapeHtml(message)}</p>
        </div>
      `;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function openFaceSearchModal() {
      document.getElementById('faceSearchModal').classList.remove('hidden');
      switchMode('upload');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function closeFaceSearchModal() {
      stopCamera();
      document.getElementById('faceSearchModal').classList.add('hidden');
      selectedSelfieFile = null;
      document.getElementById('selfieInput').value = '';
      document.getElementById('selfieStatusText').innerText = 'Click to select portrait photo';
      document.getElementById('selfieSubText').innerText = 'JPEG, PNG or WEBP (Instant AI Matching)';
      document.getElementById('selfiePreviewImg').classList.add('hidden');
      document.getElementById('selfiePreviewImg').src = '';
      document.getElementById('defaultUploadIcon').classList.remove('hidden');
      document.getElementById('matchFaceBtn').disabled = true;
      document.getElementById('scanProgressContainer').classList.add('hidden');
    }

    function switchMode(mode) {
      const uploadTab = document.getElementById('tabUploadBtn');
      const cameraTab = document.getElementById('tabCameraBtn');
      const uploadArea = document.getElementById('uploadAreaView');
      const cameraArea = document.getElementById('cameraAreaView');

      if (mode === 'upload') {
        stopCamera();
        uploadTab.className = 'flex-1 py-2 text-xs font-bold rounded-full bg-white shadow-xs text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer';
        cameraTab.className = 'flex-1 py-2 text-xs font-bold rounded-full text-gray-500 hover:text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer';
        uploadArea.classList.remove('hidden');
        cameraArea.classList.add('hidden');
      } else {
        uploadTab.className = 'flex-1 py-2 text-xs font-bold rounded-full text-gray-500 hover:text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer';
        cameraTab.className = 'flex-1 py-2 text-xs font-bold rounded-full bg-white shadow-xs text-gray-900 transition flex items-center justify-center gap-2 cursor-pointer';
        uploadArea.classList.add('hidden');
        cameraArea.classList.remove('hidden');
        startCamera();
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function startCamera() {
      const video = document.getElementById('webcamVideo');
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = cameraStream;
      } catch (err) {
        alert('Could not access webcam. Please verify browser camera permissions.');
        switchMode('upload');
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    function captureCameraShot() {
      const video = document.getElementById('webcamVideo');
      const canvas = document.createElement('canvas');
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        selectedSelfieFile = new File([blob], `selfie_${Date.now()}.jpg`, { type: 'image/jpeg' });

        const previewImg = document.getElementById('selfiePreviewImg');
        previewImg.src = URL.createObjectURL(blob);
        previewImg.classList.remove('hidden');
        document.getElementById('defaultUploadIcon').classList.add('hidden');
        document.getElementById('selfieStatusText').innerText = 'Camera Snapshot Ready';
        document.getElementById('selfieSubText').innerText = `${(blob.size / (1024 * 1024)).toFixed(2)} MB — Captured`;

        switchMode('upload');
        document.getElementById('matchFaceBtn').disabled = false;
      }, 'image/jpeg', 0.90);
    }

    function handleSelfieChosen(e) {
      const file = e.target.files[0];
      if (file) {
        selectedSelfieFile = file;
        document.getElementById('selfieStatusText').innerText = file.name;
        document.getElementById('selfieSubText').innerText = `${(file.size / (1024 * 1024)).toFixed(2)} MB — Ready`;

        const reader = new FileReader();
        reader.onload = function(evt) {
          const previewImg = document.getElementById('selfiePreviewImg');
          previewImg.src = evt.target.result;
          previewImg.classList.remove('hidden');
          document.getElementById('defaultUploadIcon').classList.add('hidden');
        };
        reader.readAsDataURL(file);

        document.getElementById('matchFaceBtn').disabled = false;
      }
    }

    function compressSelfieForUpload(file, maxDimension = 380) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDimension) {
            h = Math.round((h * maxDimension) / w);
            w = maxDimension;
          } else if (h > maxDimension) {
            w = Math.round((w * maxDimension) / h);
            h = maxDimension;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            resolve(new File([blob], 'selfie.jpg', { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.85);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    async function executeFaceSearch() {
      if (!selectedSelfieFile) return;

      const targetIdentifier = (activeEvent && (activeEvent.id || activeEvent.slug)) || getEventIdentifier();
      const btn = document.getElementById('matchFaceBtn');
      const progressContainer = document.getElementById('scanProgressContainer');

      btn.disabled = true;
      progressContainer.classList.remove('hidden');

      try {
        const compressedSelfie = await compressSelfieForUpload(selectedSelfieFile, 380);
        const formData = new FormData();
        formData.append('selfie', compressedSelfie);

        const res = await fetch(`/api/galleries/${encodeURIComponent(targetIdentifier)}/search-face`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (res.ok && data.success) {
          closeFaceSearchModal();
          matchedPhotos = data.matchedPhotos || [];

          if (matchedPhotos.length === 0) {
            alert('Face scan completed: No matching photos found for this person.');
            return;
          }

          document.getElementById('filterRibbon').classList.remove('hidden');
          document.getElementById('filterText').innerText = `Matched photos for your face`;
          document.getElementById('filterCount').innerText = `${matchedPhotos.length} photo(s) found`;

          renderPhotos(matchedPhotos, "Matched Photos");
        } else {
          alert(data.message || 'No matching face detected.');
        }
      } catch (err) {
        alert('Communication error while scanning selfie.');
      } finally {
        btn.disabled = false;
        progressContainer.classList.add('hidden');
      }
    }

    function resetGalleryView() {
      document.getElementById('filterRibbon').classList.add('hidden');
      renderPhotos(allPhotos);
    }

    function openLightbox(src, filename) {
      if (!src) return;
      activeLightboxUrl = src;
      activeLightboxFilename = filename || 'photo.jpg';
      document.getElementById('lightboxImg').src = src;
      document.getElementById('imageLightbox').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('imageLightbox').classList.add('hidden');
      activeLightboxUrl = '';
      activeLightboxFilename = '';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
